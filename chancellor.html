<!DOCTYPE html>
<!--
  FROZEN HISTORICAL ARTIFACT — not the live game.

  This single-file build is the old ~5-bloc reference. The playable app is the
  Next.js modular stack under app/, components/, and lib/sim/ (sovereign seats,
  country statute books, FX areas, bilateral trade). Do not treat this file as
  a source of truth, and do not regenerate lib/sim/engine.js from it.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Economic simulator (legacy single-file)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
:root{
  /* iOS-style glass over a dark planet. Surfaces are translucent white with a
     specular top edge; depth comes from blur and stacking, not from borders. */
  --g-1:rgba(255,255,255,.07);
  --g-2:rgba(255,255,255,.11);
  --g-3:rgba(255,255,255,.16);
  --g-4:rgba(255,255,255,.24);
  --edge:rgba(255,255,255,.16);
  --edge-hi:rgba(255,255,255,.42);
  --spec:inset 0 1px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(255,255,255,.06);
  --blur:blur(32px) saturate(190%);
  --blur-lt:blur(20px) saturate(170%);

  --ink:#fff;
  --ink-soft:rgba(255,255,255,.62);
  --ink-faint:rgba(255,255,255,.38);

  --blue:#0A84FF; --blue-lt:#64D2FF;
  --green:#30D158; --green-lt:#6BE38A;
  --red:#FF453A;   --red-lt:#FF7A72;
  --amber:#FF9F0A; --yellow:#FFD60A;
  --purple:#BF5AF2; --pink:#FF375F; --teal:#40CBE0;

  --r-lg:26px; --r-md:17px; --r-sm:12px; --r-pill:999px;
  --shadow:0 10px 34px rgba(0,0,0,.46);
  --shadow-lg:0 22px 60px rgba(0,0,0,.58);

  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",sans-serif;
  --display:var(--sans);
  --mono:var(--sans);
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;margin:0;padding:0}
body{
  font-family:var(--sans);font-size:15px;line-height:1.45;color:var(--ink);
  background:#05070d;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit;letter-spacing:-.01em}
[hidden]{display:none!important}

/* ================= map layer ================= */
#mapLayer{position:fixed;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:78px 12px 86px;
  background:radial-gradient(ellipse at 50% 45%,#0f1c33 0%,#080e1c 58%,#04060c 100%)}
#mapStage{position:relative;flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.mapcanvas{max-width:100%;max-height:100%;width:auto;height:auto;image-rendering:auto;
  border-radius:var(--r-lg);cursor:crosshair;
  filter:drop-shadow(0 18px 46px rgba(0,0,0,.6))}
#mapLabel{flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;
  padding:7px 16px;border-radius:var(--r-md);background:var(--g-2);
  backdrop-filter:var(--blur-lt);-webkit-backdrop-filter:var(--blur-lt);
  border:1px solid var(--edge);box-shadow:var(--spec);pointer-events:none;max-width:94vw}
#mapLabel b{font-size:14.5px;font-weight:650;letter-spacing:-.02em}
#mapLabel span{font-size:11.5px;color:var(--ink-soft)}
#mapMetrics{flex:none;width:min(420px,92vw)}
#mapMetrics .seg{background:var(--g-2);backdrop-filter:var(--blur-lt);-webkit-backdrop-filter:var(--blur-lt);
  border:1px solid var(--edge);box-shadow:var(--spec)}
@media(max-width:540px){#mapLayer{padding:74px 8px 80px} #mapMetrics{width:96vw}}
#vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 46%,transparent 46%,rgba(3,5,11,.5) 80%,rgba(3,5,11,.8) 100%)}

/* ================= top bar ================= */
#topbar{position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;align-items:center;gap:10px;
  padding:7px 8px 7px 12px;border-radius:var(--r-lg);
  background:var(--g-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:var(--spec),var(--shadow)}
.tb-id{display:flex;align-items:center;gap:9px;flex:none}
.tb-crest{width:34px;height:34px;flex:none;display:grid;place-items:center;font-size:16px;
  color:#fff;border-radius:var(--r-sm);background:var(--g-3);box-shadow:var(--spec)}
.tb-name{font-size:16px;font-weight:600;line-height:1.1;white-space:nowrap;letter-spacing:-.02em}
.tb-name button{background:none;border:none;color:inherit;font:inherit;letter-spacing:inherit;padding:0;
  cursor:text;border-radius:6px;transition:background .15s}
.tb-name button:hover{background:var(--g-2);box-shadow:0 0 0 5px var(--g-2)}
.tb-name button:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:3px}
.tb-name input{font:inherit;letter-spacing:inherit;color:#fff;background:var(--g-3);border:1px solid var(--edge);
  border-radius:8px;padding:1px 7px;width:11ch;min-width:0;max-width:44vw}
.tb-name input:focus{outline:2.5px solid var(--blue-lt);outline-offset:1px}
.tb-name small{display:block;font-size:10.5px;font-weight:400;color:var(--ink-soft);margin-top:1px;letter-spacing:0}
.tb-stats{margin-left:auto;display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.tb-stats::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:var(--r-sm);background:var(--g-1);text-align:right;min-width:70px}
.chip .k{font-size:9.5px;font-weight:500;color:var(--ink-faint);white-space:nowrap;letter-spacing:0}
.chip .v{font-size:16px;font-weight:600;line-height:1.2;white-space:nowrap;letter-spacing:-.03em}
.chip .v small{font-size:10px;font-weight:500;color:var(--ink-faint);margin-left:1px}
.chip .d{font-size:9.5px;font-weight:500;line-height:1.1;color:var(--ink-faint)}
.chip .d.up{color:var(--green-lt)} .chip .d.dn{color:var(--red-lt)}
.chip.alert{background:rgba(255,69,58,.18)} .chip.alert .v{color:var(--red-lt)}
.chip.good{background:rgba(48,209,88,.16)} .chip.good .v{color:var(--green-lt)}
/* Not yours to set: the Bank's rate is shown in a different key. */
.chip.bank{background:rgba(191,90,242,.14)}
.chip.bank .k:after{content:" \00B7 Bank";color:var(--purple);font-weight:600}
.chip.bank .v{color:#dab6f5}

/* ================= dock ================= */
#dock{position:fixed;bottom:10px;left:10px;right:10px;z-index:20;display:flex;align-items:center;gap:8px;
  padding:7px;border-radius:var(--r-lg);
  background:var(--g-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:var(--spec),var(--shadow)}
.dock-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.dock-tabs::-webkit-scrollbar{display:none}
.dock-btn{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;
  background:transparent;border:none;border-radius:var(--r-md);color:var(--ink-soft);
  padding:7px 13px;cursor:pointer;font-size:10.5px;font-weight:500;min-width:62px;
  transition:background .18s ease,color .18s ease,transform .18s cubic-bezier(.2,.9,.3,1)}
.dock-btn:hover{background:var(--g-2);color:#fff}
.dock-btn:active{transform:scale(.94)}
.dock-btn[aria-expanded=true]{background:var(--blue);color:#fff;box-shadow:var(--spec),0 4px 14px rgba(10,132,255,.5)}
.dock-btn:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:2px}
.dock-btn .pip{position:absolute;top:4px;right:8px;width:7px;height:7px;border-radius:50%;
  background:var(--amber);box-shadow:0 0 0 2px rgba(0,0,0,.28)}
.dock-act{display:flex;align-items:stretch;gap:6px;flex:none}
.dock-bill{display:flex;flex-direction:column;justify-content:center;gap:1px;text-align:right;cursor:pointer;
  background:var(--g-2);border:1px solid var(--edge);border-radius:var(--r-md);color:var(--ink-soft);
  padding:6px 12px;font-size:10px;font-weight:500;white-space:nowrap;box-shadow:var(--spec);
  transition:background .18s,color .18s}
.dock-bill b{font-size:13px;font-weight:600;color:#fff;letter-spacing:-.02em}
.dock-bill:hover{background:var(--g-3)}
.dock-bill[aria-expanded=true]{background:var(--blue);color:rgba(255,255,255,.8);border-color:transparent}
.dock-bill[aria-expanded=true] b{color:#fff}
.dock-go{border:none;border-radius:var(--r-md);padding:11px 20px;cursor:pointer;
  font-size:13.5px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;
  background:var(--blue);color:#fff;box-shadow:var(--spec),0 4px 16px rgba(10,132,255,.42);
  transition:filter .18s,transform .18s cubic-bezier(.2,.9,.3,1)}
.dock-go:hover{filter:brightness(1.12)}
.dock-go:active{transform:scale(.96)}
.dock-go.ghost{background:var(--g-2);color:#fff;border:1px solid var(--edge);box-shadow:var(--spec)}
.dock-go.ghost:hover{background:var(--g-3);filter:none}
.dock-go:disabled{background:var(--g-1);color:var(--ink-faint);box-shadow:none;cursor:not-allowed;filter:none;transform:none}
.dock-go:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:2px}

/* ================= drawer ================= */
#drawer{position:fixed;left:10px;right:10px;bottom:78px;z-index:15;display:flex;flex-direction:column;
  max-height:min(64vh,640px);border-radius:var(--r-lg);overflow:hidden;
  background:var(--g-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:var(--spec),var(--shadow-lg);
  animation:drawerUp .34s cubic-bezier(.22,1,.3,1)}
@keyframes drawerUp{from{opacity:0;transform:translateY(22px) scale(.985)}to{opacity:1;transform:none}}
.dw-head{flex:none;display:flex;align-items:center;gap:10px;padding:13px 16px 11px;
  border-bottom:1px solid var(--edge)}
.dw-head h2{margin:0;font-size:19px;font-weight:650;letter-spacing:-.03em}
.dw-head .sub{font-size:11.5px;color:var(--ink-soft)}
.dw-head button{margin-left:auto;flex:none;width:28px;height:28px;border-radius:var(--r-pill);cursor:pointer;
  background:var(--g-3);border:none;color:var(--ink-soft);font-size:12px;line-height:1;box-shadow:var(--spec)}
.dw-head button:hover{background:var(--g-4);color:#fff}
.dw-body{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 18px;-webkit-overflow-scrolling:touch}
.dw-body::-webkit-scrollbar{width:8px}
.dw-body::-webkit-scrollbar-thumb{background:var(--g-3);border-radius:var(--r-pill)}
@media(min-width:920px){
  #drawer{left:auto;right:10px;width:min(560px,46vw);top:76px;bottom:78px;max-height:none}
  #drawer.wide{width:min(900px,64vw)}
}
@media(max-width:540px){
  .tb-name{font-size:14px} .chip{min-width:58px;padding:5px 8px} .chip .v{font-size:14px}
  .dock-btn{min-width:52px;padding:6px 9px;font-size:9.5px}
  .dock-go{padding:10px 13px;font-size:12.5px} .dock-bill{padding:5px 9px}
  #drawer{left:6px;right:6px;bottom:74px;max-height:68vh}
  #topbar{left:6px;right:6px} #dock{left:6px;right:6px}
}

/* ================= shared content ================= */
.eyebrow{font-size:11px;font-weight:600;color:var(--ink-faint);display:flex;align-items:center;gap:9px;
  margin:0 0 9px;letter-spacing:.01em;text-transform:uppercase}
.eyebrow:after{content:"";flex:1;height:1px;background:var(--edge)}
.eyebrow.mt{margin-top:22px}
.hint{font-size:12.5px;color:var(--ink-soft);margin:-3px 0 12px;line-height:1.4}
.panel{background:var(--g-1);border-radius:var(--r-md);border:1px solid var(--edge);overflow:hidden}
.panel+.panel{margin-top:10px}
.empty{padding:18px;color:var(--ink-faint);font-size:12.5px}
.note{color:var(--ink-faint);font-size:11px}
.src{font-size:10.5px;color:var(--ink-faint);margin-top:7px;font-weight:500}
.briefing{border-left:3px solid var(--blue);border-radius:3px;padding:2px 0 2px 13px;margin-bottom:18px}
.briefing p{margin:0 0 7px;font-size:15.5px;line-height:1.42;letter-spacing:-.015em}

/* sliders */
.lever{padding:9px 13px;border-bottom:1px solid var(--edge)}
.lever:last-child{border-bottom:none}
.lever .top{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.lever .nm{font-weight:500}
.lever .val{margin-left:auto;font-size:13.5px;font-weight:600;letter-spacing:-.02em}
.lever .chg{font-size:11px;width:42px;text-align:right;font-weight:600;color:var(--ink-faint)}
.lever .chg.up{color:var(--red-lt)} .lever .chg.dn{color:var(--green-lt)}
.lever.spend .chg.up{color:var(--green-lt)} .lever.spend .chg.dn{color:var(--red-lt)}
.lever .yield{font-size:11px;color:var(--ink-faint);margin-top:2px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;cursor:grab;margin:2px 0 0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:var(--r-pill);background:var(--g-3);box-shadow:inset 0 1px 2px rgba(0,0,0,.3)}
input[type=range]::-moz-range-track{height:5px;border-radius:var(--r-pill);background:var(--g-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;
  background:#fff;margin-top:-7.5px;box-shadow:0 2px 7px rgba(0,0,0,.45),inset 0 -1px 1px rgba(0,0,0,.12)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none;
  box-shadow:0 2px 7px rgba(0,0,0,.45)}
input[type=range]:active{cursor:grabbing}
input[type=range]:disabled::-webkit-slider-thumb{background:var(--ink-faint)}
input[type=range]:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:3px}

/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:9px}
.card{background:var(--g-1);border:1px solid var(--edge);border-radius:var(--r-md);padding:12px 13px;
  display:flex;flex-direction:column;gap:6px;transition:background .18s}
.card:hover{background:var(--g-2)}
.card.on{background:rgba(48,209,88,.13);border-color:rgba(48,209,88,.4)}
.card.staged{background:rgba(10,132,255,.15);border-color:rgba(10,132,255,.5)}
.card h4{margin:0;font-size:14.5px;font-weight:600;display:flex;gap:8px;align-items:baseline;letter-spacing:-.02em}
.card h4 .cat{margin-left:auto;font-size:10px;font-weight:500;color:var(--ink-faint);text-transform:uppercase}
.card p{margin:0;font-size:12.5px;color:var(--ink-soft);line-height:1.42}
.card .eff{font-size:11.5px;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:3px 10px}
.card .eff b{font-weight:600;color:#fff}
.card .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:3px}
.pc{font-size:11px;color:var(--ink-faint);font-weight:500}

/* buttons inside content */
.btn{margin-left:auto;background:var(--g-3);border:none;border-radius:var(--r-pill);color:#fff;
  padding:6px 14px;cursor:pointer;font-size:12px;font-weight:600;box-shadow:var(--spec);
  transition:background .16s,transform .16s}
.btn:hover{background:var(--g-4)}
.btn:active{transform:scale(.95)}
.btn:disabled{background:var(--g-1);color:var(--ink-faint);cursor:not-allowed;transform:none}
.btn.danger{background:rgba(255,69,58,.26);color:var(--red-lt)}
.btn.danger:hover{background:rgba(255,69,58,.4);color:#fff}
.btn.tiny{padding:3px 10px;font-size:11px}
.btn:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:2px}
.reset{display:block;margin:10px auto 0;background:none;border:none;color:var(--ink-faint);
  font-size:12px;cursor:pointer;text-decoration:underline;font-weight:500}
.reset:hover{color:var(--ink)}

/* segmented control */
.seg{display:flex;width:100%;background:var(--g-1);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{flex:1;background:transparent;border:none;border-radius:10px;padding:7px 5px;cursor:pointer;
  font-size:11.5px;font-weight:550;color:var(--ink-soft);transition:background .16s,color .16s}
.seg button:hover{color:#fff}
.seg button[aria-pressed=true]{background:var(--g-4);color:#fff;box-shadow:var(--spec)}
.seg button.staged{background:var(--blue);color:#fff}
.seg button:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:-2px}
.seg.mini button{padding:5px 4px;font-size:10.5px}

/* tax bands */
.taxrow{display:flex;align-items:center;gap:8px;padding:8px 13px;border-bottom:1px solid var(--edge);font-size:13.5px}
.taxrow:last-child{border-bottom:none}
.bandblock{border:1px solid var(--edge);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px;background:var(--g-1)}
.bandblock.dim{opacity:.5}
.bandhead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin-bottom:5px}
.bandadd{display:flex;gap:8px;margin-top:6px}

/* factions and meters */
.frow{display:grid;grid-template-columns:78px 1fr 30px;align-items:center;gap:8px;font-size:12.5px}
.frow .fb{height:7px;border-radius:var(--r-pill);background:var(--g-2);overflow:hidden}
.frow .fb i{display:block;height:100%;border-radius:var(--r-pill);background:var(--ink-soft);transition:width .4s cubic-bezier(.2,.9,.3,1)}
.frow .fb i.good{background:var(--green)} .frow .fb i.bad{background:var(--red)}
.frow .fv{font-size:11.5px;text-align:right;color:var(--ink-soft);font-weight:600}

/* the bill */
.clause{display:flex;gap:9px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--edge);align-items:flex-start}
.clause:last-of-type{border-bottom:none}
.clause .x{background:var(--g-2);border:none;border-radius:50%;width:20px;height:20px;flex:none;
  color:var(--ink-soft);cursor:pointer;font-size:12px;line-height:1;padding:0}
.clause .x:hover{background:rgba(255,69,58,.3);color:#fff}
.clause .cost{margin-left:auto;font-size:11.5px;color:var(--blue-lt);white-space:nowrap;font-weight:600}
.empty-bill{font-size:12.5px;color:var(--ink-faint);padding:8px 0 10px;line-height:1.5}
.arith{border-top:1px solid var(--edge);margin-top:12px;padding-top:10px;font-size:13px}
.arith div{display:flex;padding:3px 0;color:var(--ink-soft)}
.arith div span:last-child{margin-left:auto;color:#fff;font-weight:600}
.arith .total{border-top:1px solid var(--edge);margin-top:6px;padding-top:8px;font-size:14.5px;font-weight:650;color:#fff}
.arith .neg span:last-child,.arith .neg{color:var(--red-lt)}
.arith .pos span:last-child,.arith .pos{color:var(--green-lt)}

/* ledger */
.ledger-wrap{border:1px solid var(--edge);border-radius:var(--r-md);background:var(--g-1);overflow-x:auto}
table.ledger{border-collapse:collapse;width:100%;font-size:12.5px;min-width:640px;font-variant-numeric:tabular-nums}
table.ledger th{font-weight:600;font-size:10.5px;color:var(--ink-faint);text-align:right;padding:9px 10px;
  border-bottom:1px solid var(--edge);white-space:nowrap;text-transform:uppercase}
table.ledger th:first-child{text-align:left}
table.ledger td{padding:7px 10px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06)}
table.ledger td:first-child{text-align:left;color:var(--ink-soft)}
table.ledger tr:last-child td{background:var(--g-2)}
table.ledger .neg{color:var(--red-lt)} table.ledger .pos{color:var(--green-lt)}

/* charts */
.chartbox{background:var(--g-1);border:1px solid var(--edge);border-radius:var(--r-md);padding:13px 15px 9px;margin-bottom:10px}
.chartbox h3{margin:0 0 2px;font-size:16px;font-weight:650;letter-spacing:-.025em}
.chartbox .cap{font-size:12px;color:var(--ink-soft);margin-bottom:9px;line-height:1.4}
.legend{display:flex;flex-wrap:wrap;gap:5px 13px;font-size:11px;color:var(--ink-soft);margin-top:7px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.chartgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chartgrid .chartbox{margin-bottom:0}
@media(max-width:800px){.chartgrid{grid-template-columns:1fr}}

.impstrip{background:rgba(10,132,255,.11);border:1px solid rgba(10,132,255,.34);
  border-radius:var(--r-md);padding:10px 12px;margin-bottom:14px}
.impstrip.empty{background:var(--g-1);border-color:var(--edge);color:var(--ink-faint);font-size:12px}
.impstrip-h{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
  color:var(--ink-soft);margin-bottom:7px}
.impstrip-h .btn{margin-left:auto}

/* sandbox impact analysis */
.impblock{background:var(--g-1);border:1px solid var(--edge);border-radius:var(--r-md);padding:10px 12px;margin-bottom:8px}
.impblock.whole{background:rgba(10,132,255,.13);border-color:rgba(10,132,255,.42)}
.imphead{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;margin-bottom:6px;letter-spacing:-.01em}
.imphead .cost{margin-left:auto;font-size:11px;font-weight:600;color:var(--blue-lt);white-space:nowrap}
.impchips{display:flex;flex-wrap:wrap;gap:4px}
.impchips span{font-size:11px;font-weight:600;padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap}
.impchips .up{background:rgba(48,209,88,.18);color:var(--green-lt)}
.impchips .dn{background:rgba(255,69,58,.18);color:var(--red-lt)}
.impfac{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--ink-faint);margin-top:5px}
.impfac .up{color:var(--green-lt)} .impfac .dn{color:var(--red-lt)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(3,6,14,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:grid;place-items:center;padding:16px;z-index:50}
.despatch{width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:var(--r-lg);
  background:var(--g-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--edge);box-shadow:var(--spec),var(--shadow-lg);
  animation:dp .38s cubic-bezier(.22,1,.3,1)}
@keyframes dp{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.despatch header{padding:17px 20px 12px;border-bottom:1px solid var(--edge)}
.despatch .stamp{font-size:11px;font-weight:600;color:var(--blue-lt);text-transform:uppercase}
.despatch h3{margin:5px 0 0;font-size:24px;font-weight:680;line-height:1.14;letter-spacing:-.035em}
.despatch .body{padding:15px 20px 6px;font-size:14.5px;line-height:1.46}
.despatch .body p{margin:0 0 12px}
.opts{padding:6px 20px 20px;display:grid;gap:8px}
.opt{text-align:left;cursor:pointer;background:var(--g-1);border:1px solid var(--edge);border-radius:var(--r-md);
  padding:12px 14px;font-family:var(--sans);font-size:14px;color:#fff;transition:background .16s,transform .16s}
.opt:hover{background:var(--g-3)}
.opt:active{transform:scale(.985)}
.opt b{display:block;font-weight:600;letter-spacing:-.02em}
.opt em{display:block;font-style:normal;font-size:12px;color:var(--ink-soft);margin-top:3px}
.opt .impchips{margin-top:7px} .opt .impfac{margin-top:4px}
.opt:focus-visible{outline:2.5px solid var(--blue-lt);outline-offset:2px}
.proj table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.proj th{font-size:10.5px;font-weight:600;color:var(--ink-faint);text-align:right;padding:6px 7px;
  border-bottom:1px solid var(--edge);text-transform:uppercase}
.proj th:first-child{text-align:left}
.proj td{padding:6px 7px;text-align:right;border-bottom:1px solid rgba(255,255,255,.06)}
.proj td:first-child{text-align:left;color:var(--ink-soft)}
.proj .neg{color:var(--red-lt)} .proj .pos{color:var(--green-lt)}
.warnlist{margin:13px 0 0;padding:0;list-style:none;display:grid;gap:7px}
.warnlist li{font-size:13px;padding-left:16px;position:relative;line-height:1.4}
.warnlist li:before{content:"";position:absolute;left:0;top:6px;width:6px;height:6px;border-radius:50%;background:var(--amber)}
.verdict{text-align:center}
.verdict .grade{font-size:64px;font-weight:700;line-height:1;color:var(--blue-lt);letter-spacing:-.05em}
.verdict .lede{font-size:16px;margin:8px 0 15px;text-align:left;color:var(--ink-soft);line-height:1.45}
.verdict table{width:100%;border-collapse:collapse;font-size:12.5px;text-align:left}
.verdict td{padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);color:var(--ink-soft)}
.verdict td:last-child{text-align:right;color:#fff;font-weight:600}

.globe-fallback{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;
  align-items:center;justify-content:center;padding:18px;text-align:center}
.globe-fallback img{max-width:90%;max-height:70%;border-radius:var(--r-md);opacity:.9}
.globe-fallback p{margin:0;font-size:12px;color:var(--ink-faint)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* UK 2025-26: total managed expenditure 44.8% of GDP, receipts 40.4%, deficit

   lines to reach that total; OTHER_REV covers council tax, business rates,
   stamp duty and the smaller duties. */
const OTHER_SPEND = 8.4, OTHER_REV = 10.3, TERM_LEN = 20;

/* --- The income distribution: twenty equal slices of the taxpaying
   population, gross annual income in pounds. Income tax and national insurance
   are integrated over this rather than approximated by a single rate, so
   thresholds matter as much as rates, and fiscal drag falls out for free: hold
   a threshold still while wages rise and the real tax take climbs on its own. */
const INCOME_DIST = [
  {w:0.05, inc:5000},  {w:0.05, inc:9000},  {w:0.05, inc:12000}, {w:0.05, inc:14500},
  {w:0.05, inc:17000}, {w:0.05, inc:19500}, {w:0.05, inc:22000}, {w:0.05, inc:24500},
  {w:0.05, inc:27000}, {w:0.05, inc:29500}, {w:0.05, inc:32000}, {w:0.05, inc:34500},
  {w:0.05, inc:37500}, {w:0.05, inc:41000}, {w:0.05, inc:45000}, {w:0.05, inc:50000},
  {w:0.05, inc:56000}, {w:0.05, inc:65000}, {w:0.05, inc:80000},
  /* The top five percent is a Pareto tail, not a point mass. Without this a new
     band above the old top slice would raise literally nothing, and the whole
     argument about taxing the rich would be unplayable. */
  {w:0.035, inc:110000}, {w:0.010, inc:190000}, {w:0.004, inc:350000}, {w:0.001, inc:1200000}
];
/* Chosen so the implied multipliers land near the empirical range: roughly 1.0
   for public investment, 0.75 for transfers, 0.55 for a broad tax cut. */
const FISCAL_K = 4.0;

/* Employer contributions are ultimately borne by workers as lower wages, but the
   pass-through takes years (Gruber 1997; Saez, Matsaganis & Tsakloglou 2012).
   Until it completes, the tax sits as a wedge between what a job costs and what
   the worker receives, and that unshifted part is what shows up in employment.
   At 0.075 a quarter, half of a change has passed into wages after nine
   quarters and nearly all of it after five years. */
const WAGE_SHIFT = 0.075;

/* Wage-setting / price-setting equilibrium unemployment, after Layard, Nickell
   and Jackman. Structural unemployment rises with the total tax wedge, with the
   benefit replacement ratio, and falls with active labour market spending:

     u* = u0 + a1*(wedge - wedge0) + a2*(unshifted employer wedge)
             + a3*(replacement ratio) - a4*(skills)

   The wedge enters in percentage points. a1 near 0.06 sits at the lower end of
   Nickell's estimates; a2 is larger because a cost that has not yet reached
   wages falls directly on labour demand. */
const U_STAR = 4.1, WEDGE_ELAST = 0.06, LABOUR_COST_ELAST = 0.30,
      REPLACEMENT_ELAST = 0.06, SKILLS_ELAST = 0.05;

/* IS curve */
const R_NEUTRAL = 3.4, R_NEUTRAL_REAL = 2.0, IS_SIGMA = 0.42, IS_THETA = 0.22;
/* Phillips curve: lambda is inertia, kappa the slope, anchor the weight on target */
const PI_TARGET = 2.0, PI_LAMBDA = 0.55, PI_KAPPA = 0.16, PI_ANCHOR = 0.28, PI_ADJ = 0.09;

/* ---- Wages and unit labour costs ----
   Prices do not respond to the output gap directly. Firms mark up over unit
   labour costs, and unit labour costs are wage growth less productivity growth.
   Wages are bargained against expected inflation and the state of the labour
   market:

       wage growth = expected inflation + productivity growth + w*(u* - u)
       ULC growth  = wage growth - productivity growth
       inflation   = markup pass-through of ULC + import prices + indirect taxes

   This is what makes the employer NI wedge, the minimum wage and the
   participation margin reach prices through the channel they actually use. */
const WAGE_CURVE = 0.42;      // wage response to a point of labour market slack
const ULC_PASS = 0.62;        // pass-through of unit labour costs into prices
const IMPORT_PASS = 0.16;     // pass-through of import prices

/* ---- Credibility as a stock ----
   How firmly expectations are anchored is not a constant. It is earned by
   keeping inflation near target and lost by missing it, and it decides how much
   weight expectations put on the target rather than on recent experience. */
const CRED_GAIN = 0.035, CRED_LOSS = 0.030;

/* ---- Effective lower bound ----
   Policy cannot cut below this. At the bound the monetary offset disappears, so
   fiscal multipliers rise on their own and a fall in inflation raises the real
   rate rather than lowering it. */
/* ---- Effective lower bound ----
   Policy can cut into mild negative territory (euro-area / Swiss style NIRP).
   At the bound the monetary offset disappears, so fiscal multipliers rise on
   their own and a fall in inflation raises the real rate rather than lowering
   it. Manual mode can go a little deeper for experimentation. */
const RATE_FLOOR = -1;
const MANUAL_RATE_MIN = -2;
/* Taylor rule */
/* Policy rates are smoothed heavily in practice: central banks move in steps
   and rarely jump to the rule's prescription in one quarter. At 0.45 the Bank
   was offsetting a fiscal impulse inside the same quarter it landed, which
   cancelled induced consumption entirely and left transfer multipliers near
   zero. */
/* The Phillips curve is convex: nearly flat when there is slack, steep once the
   economy runs hot. A linear curve let an overheating economy generate only
   proportionate inflation, which is exactly the regime where a Chancellor's
   mistakes should start compounding. */
const PI_CONVEX = 1.7;

/* Multipliers are state-dependent (Auerbach & Gorodnichenko): fiscal policy
   works harder in a slump, because more households are liquidity-constrained
   when incomes are falling and there is idle capacity to put back to work. */
const SLACK_MPC = 0.075;

/* Profit shifting. The dominant behavioural response to corporate tax is not
   less investment, it is profits being booked somewhere else. Reported profits
   move by roughly 1.5 to 2 per cent per point of differential against the rest
   of the world. */
const WORLD_CORP = 21, SHIFT_ELAST = 0.018;

/* About a quarter of UK gilts are index-linked, so that portion cannot be
   inflated away: its cost rises one-for-one with prices. Long average maturity
   is the other side of the coin, and slows how fast a yield shock reaches the
   interest bill. */
const INDEX_LINKED = 0.25, IL_REAL_COUPON = 0.6, MATURITY_PASS = 0.045;

const TAYLOR_PI = 0.6, TAYLOR_Y = 0.3, TAYLOR_SMOOTH = 0.26;
/* Okun */
const OKUN_BETA = 0.35, U_ADJ = 0.08;
const LABOUR_SHARE = 0.614;       // employment income as a share of GDP
/* Collection factors. The employer figure is reliefs and the employment
   allowance. The employee figure is larger because this model has no upper
   earnings limit: a flat 8% on everything above the allowance would raise far
   more than the UK's 8%-then-2% structure does, so the visible rate stays at
   the real headline and the collected share carries the difference. */
const EMPLOYER_COLLECT = 0.71, EMPLOYEE_COLLECT = 0.62;
/* Elasticity of taxable income, rising with income: the top of the tail has the
   accountants. This is what bends the revenue curve, so there is no separate
   Laffer fudge on income. */
const ETI_OF = inc => 0.05 + 0.55*Math.pow(Math.max(0, Math.min(1, (inc-40000)/260000)), 0.7);
/* Above roughly a 45% combined marginal rate, activity stops being avoided and
   starts being hidden. This is what gives the basic rate a revenue peak; the
   ETI above only bends the top of the distribution. */
const informality = mtr => 1.7 * Math.pow(Math.max(0, mtr - 0.45), 2);
/* Standard iso-elastic response: declared income moves with the net-of-tax
   rate raised to the elasticity. On this form the revenue-maximising marginal
   rate is 1/(1+e), which is why the top of the distribution turns over near
   60% and the bottom does not turn over until informality bites. */
const MTR_REF = 0.30;
function declaredFactor(inc, mtr){
  const m = Math.min(0.95, Math.max(0, mtr));
  const e = ETI_OF(inc);
  return Math.max(0.15, Math.pow((1 - m)/(1 - MTR_REF), e) * (1 - informality(m)));
}
const DEF_INCOME = {
  allowance:12570, uprate:true,
  bands:[{from:12570, rate:20},{from:50270, rate:40},{from:125140, rate:45}]
};
/* Two rates, nothing else. Real NI carries its own thresholds and an upper
   earnings limit, but those duplicate the income tax bands the player already
   controls, so NI simply starts where income tax starts. What stays is the part
   that is actually distinct: incidence. The employee side comes out of the pay
   packet; the employer side taxes the job, so it feeds structural unemployment
   and prices instead. Either side can be abolished outright. */
const DEF_NI = { empOn:true, erOn:true, empRate:8, erRate:15 };
const BAND_NAMES = ["Basic","Higher","Additional","Fourth","Fifth","Sixth"];

/* --- tax instruments. base = % of GDP raised per point of rate --- */
const TAXES = [
  { id:"capGains", basis:"assets", name:"Capital gains tax", grp:"wealth", def:24, max:60, base:0.02292, eti:1.37, on:true,

const TAX_BY_ID = Object.fromEntries(TAXES.map(t=>[t.id,t]));

/* --- the structure of the tax system itself --- */
const REGIMES = [
  { id:"progressive", name:"Progressive bands", pc:0,
    blurb:"Graduated rates on income, separate rates on capital. What {C} has always done.",
    mult:{}, imp:{}, fac:{} },

    mult:{income:0.88}, imp:{pot:0.18, gini:2.6, eva:-0.05}, fac:{business:7, workers:-7, urban:-5, pensioners:-2}, flatIncome:true },
  { id:"consumption", name:"Consumption-led", pc:32,

    mult:{wealth:1.55, income:0.95}, imp:{pot:0.10, gini:-0.6, eva:-0.08}, fac:{business:2, workers:1} }
];

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
/* Behavioural response of a tax base to its own rate, in the standard
   constant-elasticity form used throughout the public finance literature
   (Saez 2001; Saez, Slemrod & Giertz 2012):

       B(tau) = B0 * ((1 - tau) / (1 - tau0)) ^ e

   where e is the elasticity of the taxable base with respect to the net-of-tax
   rate. Revenue is tau * B(tau), so it is maximised at tau* = 1/(1+e): the
   declared revenue-maximising rate and the elasticity are the same statement.
   `base` is therefore revenue per point of rate at the default rate, before any
   behavioural response, and the response is entirely carried by `eti`.

   This replaced an arbitrary quadratic whose peak and local slope could not be
   set independently of one another.

   A note on corporation tax, where two good benchmarks genuinely disagree. The
   ready-reckoner figure (about 0.13% of GDP per point) is a short-run costing,
   which implies marginal revenue close to average and therefore a small
   elasticity. The Laffer literature puts the peak at 30-45%, which implies an
   elasticity near 1.5 and marginal revenue at half of average. Both cannot hold
   at a 25% rate. The elasticity here is set at 1.15, a deliberate compromise:
   the peak lands at 46%, a little above the literature, and the marginal figure
   comes in at about two thirds of the ready reckoner. The short-run costing and
   the long-run peak are measuring different horizons, and a single-elasticity
   model cannot honour both. */
const baseResponse = (rate, def, eti) => {
  const tau = Math.min(0.985, rate/100), tau0 = def/100;
  return Math.pow((1 - tau)/(1 - tau0), eti);
};

/* ---- income tax and national insurance, integrated over the distribution ---- */
/* The personal allowance is the authoritative start of the first band; the UI
   deliberately offers no separate "starts at" control for band one. Thresholds
   are forced strictly increasing, so a band dragged below the allowance is
   simply absorbed by it rather than paying negative tax. */
function effectiveBands(law){
  const I = law.income;
  const b = I.bands.map((x,i)=> i === 0 ? {from:I.allowance, rate:x.rate} : {from:x.from, rate:x.rate});
  for(let i=1;i<b.length;i++) if(b[i].from < b[i-1].from) b[i].from = b[i-1].from;
  return REGIME_BY_ID[law.regime].flatIncome ? [{from:b[0].from, rate:b[0].rate}] : b;
}
function marginalBand(bands, y){ let r = 0; for(const b of bands) if(y > b.from) r = b.rate; return r; }
/* Where the taxpayer's top band starts. Behavioural response applies only to
   income above this kink: raising the additional rate should not make someone
   declare less of the salary they were already paying basic rate on. */
function bandKink(bands, y){ let k = 0; for(const b of bands) if(y > b.from) k = b.from; return k; }
function incomeTaxOn(y, bands){
  let t = 0;
  for(let i=0;i<bands.length;i++){
    const from = bands[i].from, to = i+1 < bands.length ? bands[i+1].from : Infinity;
    if(y > from) t += (Math.min(y,to) - from) * bands[i].rate/100;
  }
  return t;
}
/* `floor` is the income tax personal allowance: NI bites where income tax does. */
function niOn(y, ni, floor){
  const base = Math.max(0, y - floor);
  return {
    emp: ni.empOn === false ? 0 : base * ni.empRate/100 * EMPLOYEE_COLLECT,
    er:  ni.erOn  === false ? 0 : base * ni.erRate/100 * EMPLOYER_COLLECT
  };
}
function incomeYield(law, E, econ){
  const ni = law.ni, wage = (econ && econ.wageIndex) || 1;
  const bands = effectiveBands(law);
  const floor = bands[0].from;
  const mult = (REGIME_BY_ID[law.regime].mult || {}).income || 1;
  let tax = 0, emp = 0, er = 0, meanBase = 0;
  for(const slice of INCOME_DIST){
    const y = slice.inc * wage;
    meanBase += y * slice.w;
    const mtrNi = ni.empOn === false ? 0 : y > floor ? ni.empRate : 0;
    const mtr = (marginalBand(bands, y) + mtrNi)/100;
    const kink = bandKink(bands, y);
    const declared = Math.min(y, kink) + Math.max(0, y - kink) * declaredFactor(slice.inc, mtr);
    tax += incomeTaxOn(declared, bands) * slice.w;
    const q = niOn(declared, ni, floor);
    emp += q.emp * slice.w; er += q.er * slice.w;
  }
  /* Avoidance responses to a tax's own rate already live in that tax's Laffer
     term. This economy-wide channel is only for the structural stuff (a wealth
     tax, an FTT, a digital ID regime), so it is deliberately weak: at 0.15 a
     single point of inheritance tax lost more revenue across the whole base
     than the tax itself raised, which made its marginal yield negative. */
  const evasion = 1 - clamp(E ? E.eva : 0, -0.7, 0.7)*0.05;
  const k = LABOUR_SHARE * 100 / meanBase * evasion;
  return { income: tax*k*mult, employee: emp*k, employer: er*k, total: (tax*mult + emp + er)*k };
}
/* Population-weighted marginal rate and progressivity. Declared-income effects
   are handled inside incomeYield; this is the separate real-economy channel:
   high marginal rates on labour reduce participation and raise structural
   unemployment, and a progressive schedule compresses the distribution. */
/* The propensity to consume falls with income: a poor household spends nearly
   all of an extra pound, a rich one saves most of it. The model already
   integrates the tax system over a 23-slice income distribution, so the same
   distribution can carry consumption behaviour, and the *incidence* of a tax
   change then drives demand directly.

   This replaced a single aggregate split keyed off the Gini, which could not
   tell the difference between raising the personal allowance and cutting the
   additional rate. It now can: the first puts money where it is spent. */
const MPC_BOTTOM = 0.88, MPC_TOP = 0.22;
function mpcAt(income, median){
  const rel = Math.log(Math.max(0.15, income / median)) / Math.log(9);
  return clamp(MPC_BOTTOM + (MPC_TOP - MPC_BOTTOM) * clamp(rel + 0.45, 0, 1), MPC_TOP, MPC_BOTTOM);
}

function incomeProfile(law, econ){
  const ni = law.ni, wage = (econ && econ.wageIndex) || 1;
  const bands = effectiveBands(law);
  const floor = bands[0].from;
  const median = 30000 * wage;
  let netW = 0, mpcW = 0;
  let meanMtr = 0, taxLow = 0, incLow = 0, taxTop = 0, incTop = 0;
  for(const s of INCOME_DIST){
    const y = s.inc * wage;
    const mtrNi = ni.empOn === false ? 0 : y > floor ? ni.empRate : 0;
    meanMtr += (marginalBand(bands, y) + mtrNi)/100 * s.w;
    const liab = incomeTaxOn(y, bands) + niOn(y, ni, floor).emp;
    /* Post-tax income by slice, weighted into an aggregate propensity to
       consume. A tax cut aimed low raises this; one aimed high lowers it. */
    const net = Math.max(0, y - liab);
    netW += net * s.w;
    mpcW += net * s.w * mpcAt(y, median);
    if(s.inc <= 30000){ taxLow += liab*s.w; incLow += y*s.w; }
    if(s.inc >= 100000){ taxTop += liab*s.w; incTop += y*s.w; }
  }
  return { meanMtr, distMPC: netW > 0 ? mpcW/netW : 0.55, netIncome: netW,
           progressivity: (incTop ? taxTop/incTop : 0) - (incLow ? taxLow/incLow : 0) };
}
const MTR_BASE = 0.295, PROG_BASE = 0.30;

/* Real value of the personal allowance against where it started. Below 1 the
   Chancellor is raising taxes without ever announcing it. */
function dragRatio(law, econ){
  return (law.income.allowance / ((econ && econ.wageIndex) || 1)) / DEF_INCOME.allowance;
}
