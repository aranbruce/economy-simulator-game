const CAPITAL_XY = { x:0.04, y:0.08 };
/* Where each trading partner lies relative to the country, for the edge arrows. */
const PARTNER_BEARING = {
  continental:{ a: 78,  label:"E"  }, federated:{ a: 250, label:"W" },
  eastern:{ a: 118, label:"SE" },     commonwealth:{ a: 168, label:"S" },
  gulf:{ a: 140, label:"SSE" }
};

function fbm2(x, y, oct){
  let s = 0, a = 0.5, f = 1;
  for(let i=0;i<oct;i++){ s += a*vnoise(x*f, y*f, 0.37); f *= 2.03; a *= 0.5; }
  return s;
}

/* The country is built from overlapping lobes rather than one radial blob,
   which is what gives it peninsulas, bays and an asymmetric silhouette instead
   of a circle. Offshore islands are separate lobes; the lake is a negative one. */
const LOBES = [
  [ 0.00, -0.06, 0.42],   // central mass
  [-0.14, -0.46, 0.30],   // northern uplands
  [ 0.30, -0.40, 0.22],   // north-eastern arm
  [-0.46, -0.10, 0.26],   // western bulge
  [ 0.44,  0.02, 0.23],   // eastern plain
  [-0.34,  0.32, 0.21],   // south-western peninsula
  [ 0.36,  0.34, 0.22],   // south-eastern shoulder
  [ 0.04,  0.56, 0.19],   // southern tail
  [-0.10,  0.20, 0.30]    // waist, keeps north and south joined
];
const ISLES = [
  [-0.74, -0.44, 0.085],
  [ 0.72,  0.50, 0.070],
  [-0.66,  0.52, 0.055]
];
const LAKE = [-0.20, -0.16, 0.115];

function lobeField(list, dx, dy){
  let f = 0;
  for(const L of list){
    const ex = (dx - L[0]) / L[2], ey = (dy - L[1]) / L[2];
    const d2 = ex*ex + ey*ey;
    if(d2 < 6) f += Math.exp(-d2 * 1.05);
  }
  return f;
}

/* >0 is land. The noise is added in world space rather than radially, so the
   coast wanders the way a real one does instead of rippling around a circle. */
function countryField(dx, dy){
  const warp = (fbm2(dx*1.9 + 5.1, dy*1.9 + 2.7, 4) - 0.5) * 0.52;
  const fine = (fbm2(dx*6.2 + 17.3, dy*6.2 + 9.1, 3) - 0.5) * 0.20;
  const land = lobeField(LOBES, dx, dy) + warp + fine - 0.62;
  const isle = lobeField(ISLES, dx, dy) + warp*0.5 + fine - 0.58;
  let v = Math.max(land, isle);
  // inland water
  const lx = (dx - LAKE[0]) / LAKE[2], ly = (dy - LAKE[1]) / LAKE[2];
  const lake = Math.exp(-(lx*lx + ly*ly) * 1.3) + fine*0.8 - 0.72;
  if(lake > 0) v = Math.min(v, -0.02);
  return v;
}

/* Region index per pixel: 255 means sea. Also returns a border mask and the
   pixel count per region, which is what the geometry tests assert on. */
function mapGeometry(W, H){
  const idx = new Uint8Array(W*H), edge = new Uint8Array(W*H), shelf = new Uint8Array(W*H);
  const counts = new Array(REGIONS.length).fill(0);
  let land = 0;
  for(let py=0; py<H; py++){
    const dy = (py + 0.5)/H*2 - 1;
    for(let px=0; px<W; px++){
      const dx = (px + 0.5)/W*2 - 1;
      const i = py*W + px;
      if(countryField(dx, dy) <= 0){ idx[i] = 255; continue; }
      let best = 0, bd = Infinity;
      for(let r=0; r<REGIONS.length; r++){
        const R = REGIONS[r];
        const d = (dx-R.x)*(dx-R.x) + (dy-R.y)*(dy-R.y);
        if(d < bd){ bd = d; best = r; }
      }
      idx[i] = best; counts[best]++; land++;
    }
  }
  // internal borders
  for(let py=1; py<H-1; py++)
    for(let px=1; px<W-1; px++){
      const i = py*W + px, v = idx[i];
      if(v === 255) continue;
      if(idx[i-1] !== v || idx[i+1] !== v || idx[i-W] !== v || idx[i+W] !== v) edge[i] = 1;
    }

  /* Ocean is whatever the frame edge can reach. Any water it cannot reach is
     inland, and is drawn as a lake rather than as sea. */
  const ocean = new Uint8Array(W*H), stack = [];
  const push = i => { if(idx[i] === 255 && !ocean[i]){ ocean[i] = 1; stack.push(i); } };
  for(let x=0; x<W; x++){ push(x); push((H-1)*W + x); }
  for(let y=0; y<H; y++){ push(y*W); push(y*W + W-1); }
  while(stack.length){
    const i = stack.pop(), x = i % W, y = (i / W) | 0;
    if(x > 0) push(i-1); if(x < W-1) push(i+1);
    if(y > 0) push(i-W); if(y < H-1) push(i+W);
  }
  let lake = 0;
  for(let i=0;i<W*H;i++) if(idx[i] === 255 && !ocean[i]) lake++;

  /* Continental shelf: how many dilation steps of sea from the nearest coast,
     which is what lets the water shade from shallow to deep. */
  const RINGS = Math.max(3, Math.round(Math.min(W,H) * 0.045));
  let front = [];
  for(let i=0;i<W*H;i++) if(idx[i] !== 255) front.push(i);
  const seen = new Uint8Array(W*H);
  front.forEach(i=>{ seen[i] = 1; });
  for(let ring=1; ring<=RINGS && front.length; ring++){
    const next = [];
    for(const i of front){
      const x = i % W, y = (i / W) | 0;
      const nb = [];
      if(x > 0) nb.push(i-1); if(x < W-1) nb.push(i+1);
      if(y > 0) nb.push(i-W); if(y < H-1) nb.push(i+W);
      for(const j of nb) if(!seen[j] && idx[j] === 255){ seen[j] = 1; shelf[j] = RINGS - ring + 1; next.push(j); }
    }
    front = next;
  }
  return { idx, edge, shelf, ocean, counts, land, lake, rings:RINGS, W, H };
}

/* ---------- The rest of the world keeps its own books ----------
   Partners are not just relationship counters: each runs an economy with its own
   trend growth, deficit and debt, correlated to the world cycle and to shocks.
   It gives the player something the real job has and the model did not, which is
   somewhere to look to find out whether a bad quarter was their fault. */
const NATION_PROFILE = {
  continental:  { trend:1.15, debt0:92,  deficit0:3.4, vol:0.55, beta:0.9 },
  federated:    { trend:2.10, debt0:121, deficit0:6.4, vol:0.85, beta:0.7 },
  eastern:      { trend:4.10, debt0:64,  deficit0:4.2, vol:1.40, beta:0.6 },
  commonwealth: { trend:2.55, debt0:51,  deficit0:2.1, vol:0.95, beta:1.0 },
  gulf:         { trend:2.85, debt0:19,  deficit0:-5.2, vol:1.60, beta:0.5 }
};
function stepNations(e, det){
  if(!e.nations){
    e.nations = {};
    for(const id in NATION_PROFILE){
      const n = NATION_PROFILE[id];
      e.nations[id] = { y:100, growth:n.trend, debt:n.debt0, deficit:n.deficit0, inflation:2.2 };
    }
  }
  const worldPulse = (e.worldShock || 0);
  for(const id in NATION_PROFILE){
    const p = NATION_PROFILE[id], s2 = e.nations[id];
    const shock = det ? 0 : (Math.random() + Math.random() - 1) * p.vol;
    s2.growth = s2.growth*0.55 + (p.trend + worldPulse*p.beta + shock)*0.45;
    s2.y *= 1 + s2.growth/400;
    s2.deficit = clamp(s2.deficit*0.85 + (p.deficit0 - (s2.growth - p.trend)*0.7)*0.15, -12, 18);
    s2.debt = clamp(s2.debt*(1 + (2.6 - s2.growth - s2.inflation)/400) + s2.deficit/4, 0, 400);
    s2.inflation = clamp(s2.inflation*0.8 + (2.0 + (s2.growth - p.trend)*0.35)*0.2, -3, 30);
  }
}

/* ---------- Regions diverge ----------
   Each place has its own output and unemployment, and its own exposure. `beta`
   is how hard the national cycle lands there, `trade` how exposed it is to
   exports, `publicShare` how much of it depends on the state, `housing` how
   much the cost of capital matters. So the Industrial Belt takes a downturn
   harder than the Capital District, a port region feels a tariff war first, and
   a region living on public employment feels a squeeze on departmental budgets
   before anyone else does.

   Regional unemployment is sticky: it converges toward the national rate slowly,
   which is why a shock that has passed nationally can still be visible in a
   place years later. */
const REGION_STICKY = 0.045, REGION_OKUN = 0.30;

/* Places do not start level. A region built on heavy industry carries higher
   unemployment and lower output per head before the Chancellor does anything,
   which is the inheritance rather than the policy. */
function initRegions(e){
  return REGIONS.map(R => ({
    y: 100 * (0.88 + R.prosper * 0.12),
    u: clamp(e.unemployment * (0.72 + R.beta * 0.28), 1.5, 14)
  }));
}
function stepRegions(e, law, growth, tradeGrowth, publicGrowth, ucGap){
  if(!e.regions) e.regions = initRegions(e);
  const trend = e.trendGrowth || 1.0;
  e.regions.forEach((r, i) => {
    const R = REGIONS[i];
    const local = trend
      + (growth - trend) * R.beta
      + tradeGrowth * (R.trade - 1) * 0.55
      + publicGrowth * R.publicShare * 1.5
      - ucGap * R.housing * 0.30;
    r.y *= 1 + local/400;
    r.u = clamp(r.u - REGION_OKUN*(local - trend)/2
                + (e.unemployment - r.u)*REGION_STICKY, 0.8, 30);
  });
}

/* ---------- what each region is feeling ---------- */
function regionStats(r){
  const e = G.econ;
  const i = REGIONS.indexOf(r);
  const st = (e.regions && e.regions[i]) || { y:100, u:e.unemployment };
  let appr = 0;
  for(const f in r.mix) appr += (G.fac[f] || 50) * r.mix[f];
  /* A region that has fallen behind is a region whose people are less impressed,
     so local conditions feed back into local politics. */
  appr += (st.y/100 - e.gdp/100) * 55 - (st.u - e.unemployment) * 2.4;
  const urbanShare = r.mix.urban || 0;
  const prosper = r.prosper * (st.y / 100) * (1 - (e.gini - 35)*0.006);
  const services = clamp(e.services + (urbanShare - 0.3)*10 - (r.prosper < 0.85 ? 6 : 0), 0, 100);
  return { approval:clamp(appr, 0, 100), unemployment:st.u, prosperity:prosper*100, services };
}

const MAP_METRICS = [
  { id:"approval",     name:"Approval",     fmt:v=>v.toFixed(0)+"%",  lo:20, hi:70, good:"high" },
  { id:"unemployment", name:"Unemployment", fmt:v=>v.toFixed(1)+"%",  lo:2,  hi:12, good:"low"  },
  { id:"prosperity",   name:"Prosperity",   fmt:v=>v.toFixed(0),      lo:70, hi:140,good:"high" },
  { id:"services",     name:"Services",     fmt:v=>v.toFixed(0),      lo:25, hi:75, good:"high" }
];
let mapMetric = "approval", mapHover = -1;

/* Cold blue through to warm red, which reads the same way in every metric once
   `good` has been used to decide which end is which. */
function ramp(t){
  t = clamp(t, 0, 1);
  const stops = [[10,70,120],[16,120,160],[48,190,150],[190,205,90],[255,159,10],[255,69,58]];
  const x = t*(stops.length-1), i = Math.min(stops.length-2, Math.floor(x)), f = x - i;
  const a = stops[i], b = stops[i+1];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
function regionColour(r, metric){
  const m = MAP_METRICS.find(x=>x.id===metric) || MAP_METRICS[0];
  const v = regionStats(r)[m.id];
  let t = (v - m.lo)/(m.hi - m.lo);
  if(m.good === "high") t = 1 - t;          // good things stay cool
  return ramp(t);
}

const Map2D = { cv:null, ctx:null, geo:null, host:null, dpr:1, raf:0 };

function paintMap(){
  const M = Map2D;
  if(!M.ctx || !M.geo) return;
  const { idx, edge, shelf, ocean, rings, W, H } = M.geo;
  const img = M.ctx.createImageData(W, H);
  const d = img.data;
  const pal = REGIONS.map(r=>regionColour(r, mapMetric));
  for(let i=0; i<W*H; i++){
    const p = i*4, v = idx[i];
    if(v === 255){
      if(!ocean[i]){                              // inland water
        d[p]=26; d[p+1]=58; d[p+2]=92;
      } else {
        const t = shelf[i]/rings;                 // shallow near the coast
        d[p]   = 7  + t*22;
        d[p+1] = 15 + t*44;
        d[p+2] = 30 + t*58;
      }
      d[p+3] = 255; continue;
    }
    const c = pal[v];
    let k = 1;
    if(v === mapHover) k = 1.30;
    if(edge[i]) k *= 0.66;                        // internal region borders
    d[p]   = Math.min(255, c[0]*k);
    d[p+1] = Math.min(255, c[1]*k);
    d[p+2] = Math.min(255, c[2]*k);
    d[p+3] = 255;
  }
  // coastline: darken any land pixel touching water
  for(let y=1; y<H-1; y++)
    for(let x=1; x<W-1; x++){
      const i = y*W + x;
      if(idx[i] === 255) continue;
      if(idx[i-1] === 255 || idx[i+1] === 255 || idx[i-W] === 255 || idx[i+W] === 255){
        const p = i*4;
        d[p] *= 0.55; d[p+1] *= 0.55; d[p+2] *= 0.58;
      }
    }
  M.ctx.putImageData(img, 0, 0);

  const toPx = (x,y) => [ (x+1)/2*W, (y+1)/2*H ];
  M.ctx.save();

  const [cx, cy] = toPx(CAPITAL_XY.x, CAPITAL_XY.y);
  M.ctx.beginPath(); M.ctx.arc(cx, cy, W*0.011, 0, Math.PI*2);
  M.ctx.fillStyle = "#fff"; M.ctx.fill();
  M.ctx.lineWidth = W*0.005; M.ctx.strokeStyle = "rgba(0,0,0,.5)"; M.ctx.stroke();

  M.ctx.font = "600 " + (W*0.020|0) + "px -apple-system, system-ui, sans-serif";
  M.ctx.textAlign = "center"; M.ctx.textBaseline = "middle";
  for(const p of PARTNERS){
    const b = PARTNER_BEARING[p.id]; if(!b) continue;
    const rad = (b.a - 90) * Math.PI/180;
    const rr = Math.min(W,H)*0.462;
    const ax = W/2 + Math.cos(rad)*rr, ay = H/2 + Math.sin(rad)*rr;
    const rel = G.rel[p.id] || 50;
    M.ctx.fillStyle = rel > 62 ? "#30D158" : rel > 45 ? "#64D2FF" : "#FF453A";
    M.ctx.beginPath(); M.ctx.arc(ax, ay, W*0.012, 0, Math.PI*2); M.ctx.fill();
    M.ctx.fillStyle = "rgba(255,255,255,.85)";
    M.ctx.fillText(b.label, ax, ay - W*0.030);
  }
  M.ctx.restore();
}

function mapPick(clientX, clientY){
  const M = Map2D;
  if(!M.cv || !M.geo) return -1;
  const r = M.cv.getBoundingClientRect();
  if(!r.width || !r.height) return -1;
  const px = Math.floor((clientX - r.left)/r.width * M.geo.W);
  const py = Math.floor((clientY - r.top)/r.height * M.geo.H);
  if(px < 0 || py < 0 || px >= M.geo.W || py >= M.geo.H) return -1;
  const v = M.geo.idx[py*M.geo.W + px];
  return v === 255 ? -1 : v;
}

function initMap(host){
  try{
    const W = 620, H = 620;
    const cv = document.createElement("canvas");
    cv.width = W; cv.height = H;
    cv.className = "mapcanvas";
    const ctx = cv.getContext("2d");
    if(!ctx) return false;
    host.appendChild(cv);
    Object.assign(Map2D, { cv, ctx, host, geo: mapGeometry(W, H) });

    cv.addEventListener("pointermove", ev=>{
      const r = mapPick(ev.clientX, ev.clientY);
      if(r !== mapHover){ mapHover = r; paintMap(); updateMapLabel(); }
    });
    cv.addEventListener("pointerleave", ()=>{ mapHover = -1; paintMap(); updateMapLabel(); });
    cv.addEventListener("click", ev=>{
      const r = mapPick(ev.clientX, ev.clientY);
      if(r >= 0){ mapHover = r; paintMap(); updateMapLabel(); }
    });
    paintMap();
    return true;
  } catch(err){ return false; }
}

function updateMapLabel(){
  const box = $("mapLabel");
  if(!box) return;
  if(mapHover < 0){
    const m = MAP_METRICS.find(x=>x.id===mapMetric);
    box.innerHTML = '<b>'+esc(G.country)+'</b><span>'+m.name+' by region</span>';
    return;
  }
  const r = REGIONS[mapHover], st = regionStats(r);
  box.innerHTML = '<b>'+esc(r.name)+'</b>' +
    '<span>' + MAP_METRICS.map(m=>m.name+" "+m.fmt(st[m.id])).join(" &middot; ") + '</span>';
}

function updateMap(){ if(Map2D.ctx){ paintMap(); updateMapLabel(); } }

function spark(key, w=44, h=13){
  const vals = G.log.map(r => r[key]);
  if(vals.length < 2) return "";
  const mn = Math.min(...vals), mx = Math.max(...vals), rg = (mx - mn) || 1;
  const pts = vals.map((v,i)=>(i/(vals.length-1)*w).toFixed(1) + "," + (h - (v-mn)/rg*h).toFixed(1)).join(" ");
  return '<svg width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="#eed69a" stroke-width="1.2"/></svg>';
}

/* --- the top bar --- */
/* `kind` marks a reading the Chancellor does not control, which is worth making
   visually obvious: the Bank rate is a response to your budget, not a lever in
   it. */
function chip(k, v, unit, delta, state, invert, kind){
  const cls = delta == null ? "" : (invert ? (delta < 0 ? "up" : "dn") : (delta > 0 ? "up" : "dn"));
  const d = delta == null ? "" : '<div class="d '+cls+'">'+sgn(delta,2)+'</div>';
  const title = kind === "bank"
    ? (G.rateManual
      ? ' title="Pinned by you. Turn Bank mode back on in the Bill panel to return the rate to the Taylor rule."'
      : ' title="Set by the Bank, not by you. It follows a Taylor rule: it rises when inflation is above target or output is above potential, and it is smoothed, so it moves in steps. Pin it yourself in the Bill panel."')
    : '';
  return '<div class="chip '+(state||"")+(kind?" "+kind:"")+'"'+title+'><div class="k">'+k+'</div>'+
         '<div class="v">'+v+(unit?'<small>'+unit+'</small>':'')+'</div>'+d+'</div>';
}

function renderChrome(){
  const n = G.log.length, last = n ? G.log[n-1] : null, prev = n > 1 ? G.log[n-2] : null;
  const d = k => (last && prev) ? last[k] - prev[k] : null;
  const e = G.econ, appr = approvalOf(G.fac);
  /* Balance must match the Deficit reading elsewhere (deficit = −balance).
     After the first outturn that means the logged figure from step(), which
     applies the cyclical revenue and spending shares — not a fresh balanceOf,
     which ignores those and drifts from the books the game actually ran. */
  const balShow = last ? last.balance : balanceOf(G.law, e).balance;

  const nb = $("nameBtn");
  if(nb && document.activeElement !== nb) nb.textContent = G.country;
  const tb = $("tbTerm");
  if(tb) tb.textContent = ["First","Second","Third","Fourth","Fifth","Sixth"][Math.min(G.term-1,5)] +
                          " term \u00b7 " + qLabel(G, G.q);

  const stats = $("tbStats");
  if(stats) stats.innerHTML =
    chip("Growth", last ? fmt(last.growth,1) : "\u2013", "%", d("growth"), last && last.growth < 0 ? "alert" : "") +
    chip("Inflation", e.inflation.toFixed(1), "%", d("inflation"), (e.inflation > 4 || e.inflation < 0) ? "alert" : "", true) +
    chip("Bank rate", e.rate.toFixed(2), "%", d("rate"), e.atBound ? "alert" : "", null, "bank") +
    chip("Unemp.", e.unemployment.toFixed(1), "%", d("unemployment"), e.unemployment > 6 ? "alert" : "", true) +
    chip("Balance", fmt(balShow,1), "%", d("balance"), balShow < -6 ? "alert" : balShow >= 0 ? "good" : "") +
    chip("Debt", e.debt.toFixed(0), "%", d("debt"), e.debt > 120 ? "alert" : "", true) +
    chip("Yield", e.yield.toFixed(2), "%", d("yield"), e.yield > 6.5 ? "alert" : "", true) +
    chip("Approval", appr.toFixed(0), "%", null, appr < 30 ? "alert" : appr > 55 ? "good" : "") +
    chip("Capital", Math.round(G.capital), "", null, G.capital < 12 ? "alert" : "");

  const cl = billClauses(), cost = cl.reduce((a,c)=>a+c.pc,0), afford = cost <= G.capital;

  const dock = $("dockTabs");
  if(dock){
    dock.innerHTML = TABS.map(t=>
      '<button class="dock-btn" data-tab="'+t.id+'" aria-expanded="'+(t.id===tab)+'">' +
        (ICONS[t.icon]||"") + '<span>'+t.name+'</span>' +
        (clausesIn(t.id, cl) ? '<span class="pip"></span>' : '') + '</button>').join("");
    dock.querySelectorAll("[data-tab]").forEach(btn=>{
      btn.onclick = ()=>{ tab = (tab === btn.dataset.tab) ? null : btn.dataset.tab; render(); };
    });
  }

  const bill = $("billBtn");
  if(bill){
    bill.setAttribute("aria-expanded", tab === "bill");
    $("billLabel").textContent = cl.length && !isFiscalOnly(cl) ? "Programme" : "Finance bill";
    $("billCost").textContent = cl.length ? cl.length + " \u00b7 " + cost + " cap" : "empty";
    bill.onclick = ()=>{ tab = (tab === "bill") ? null : "bill"; render(); };
  }

  const pb = $("projectBtn"), db = $("deliverBtn");
  if(pb) pb.disabled = G.over;
  if(db){
    db.disabled = G.over || !afford;
    db.textContent = cl.length === 0 ? "Next quarter" : afford ? "Deliver" : "No capital";
  }

  const dw = $("drawer");
  if(dw){
    const open = !!tab;
    dw.hidden = !open;
    dw.classList.toggle("wide", tab === "charts" || tab === "policies" || tab === "taxes");
    if(open){
      const meta = tab === "bill"
        ? { name: cl.length && !isFiscalOnly(cl) ? "The Programme" : "The Finance Bill",
            sub: cl.length ? cost + " of " + Math.round(G.capital) + " capital" : "no clauses" }
        : { name: (TABS.find(t=>t.id===tab)||{}).name || "", sub:"" };
      $("dwTitle").textContent = meta.name;
      $("dwSub").textContent = meta.sub;
    }
  }
}


function clausesIn(tabId, cl){
  const pats = { budget:/points of GDP/, taxes:/tax|duty|levy|rate|tariff|Restructure|price|pricing/i,
                 policies:/Enact|Repeal/, society:/Cannabis|Psychedelics|Gambling|Alcohol|Tobacco|Adult services/,
                 trade:/Ratify|Withdraw|tariff/i, charts:/(?!)/ };
  return cl.some(c => pats[tabId] && pats[tabId].test(c.label));
}

function wireLevers(root, get, set, decimals){
  root.querySelectorAll("[data-lever] input").forEach(inp=>{

      row.querySelector(".val").textContent = v.toFixed(+row.dataset.dp || decimals) + "%";
      const c = row.querySelector(".chg");

    paint();
    inp.addEventListener("input", ()=>{ set(id, parseFloat(inp.value)); paint(); renderChrome(); });

  });
}

/* Cash thresholds uprate with wages; keep real slider headroom constant so a
   long run never pins the thumb at a stale nominal ceiling. */
function thresholdSliderMax(baseMax, current, step){
  const wage = (G && G.econ && G.econ.wageIndex) || 1;
  const ceil = Math.max(baseMax * wage, (current || 0) * 1.15);
  return Math.ceil(ceil / step) * step;
}

/* ---- charts ---- */
function lineChart(series, opts){
  opts = opts || {};
  const h = opts.h || 168, w = 600, padL = 36, padR = 54, padT = 10, padB = 20;
  const len = series[0] ? series[0].data.length : 0;
  if(len < 2) return '<div class="empty">Not enough quarters recorded yet.</div>';
  let all = series.flatMap(s=>s.data).filter(v=>isFinite(v));
  let mn = Math.min(...all), mx = Math.max(...all);
  if(opts.target != null){ mn = Math.min(mn, opts.target); mx = Math.max(mx, opts.target); }
  if(opts.zero){ mn = Math.min(mn, 0); mx = Math.max(mx, 0); }
  const pad = (mx - mn)*0.14 || 1; mn -= pad; mx += pad;
  const X = i => padL + (i/(len-1))*(w-padL-padR);
  const Y = v => padT + (1 - (v-mn)/(mx-mn))*(h-padT-padB);
  let g = "";
  for(let i=0;i<=4;i++){
    const v = mn + (mx-mn)*i/4, y = Y(v);
    g += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#d6cdb8" stroke-width="1"/>' +
         '<text x="'+(padL-5)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="8.5" font-family="IBM Plex Mono, monospace" fill="#8d8474">'+v.toFixed(Math.abs(mx)>60?0:1)+'</text>';
  }
  if(opts.target != null){
    const y = Y(opts.target);
    g += '<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(w-padR)+'" y2="'+y.toFixed(1)+'" stroke="#c0392f" stroke-width="1" stroke-dasharray="3 3"/>';
  }
  const lbl = G.log.map(r=>r.label);
  for(let i=0;i<len;i+=Math.max(1,Math.ceil(len/7))){
    g += '<text x="'+X(i).toFixed(1)+'" y="'+(h-6)+'" text-anchor="middle" font-size="8" font-family="IBM Plex Mono, monospace" fill="#8d8474">'+(lbl[i]||"")+'</text>';
  }
  series.forEach(s=>{
    const pts = s.data.map((v,i)=>X(i).toFixed(1)+","+Y(v).toFixed(1)).join(" ");
    g += '<polyline points="'+pts+'" fill="none" stroke="'+s.color+'" stroke-width="'+(s.wide?2:1.4)+'"'+(s.dash?' stroke-dasharray="4 3"':'')+'/>';
    const lv = s.data[len-1];
    g += '<circle cx="'+X(len-1).toFixed(1)+'" cy="'+Y(lv).toFixed(1)+'" r="2.2" fill="'+s.color+'"/>' +
         '<text x="'+(w-padR+6)+'" y="'+(Y(lv)+3).toFixed(1)+'" font-size="9" font-family="IBM Plex Mono, monospace" fill="'+s.color+'">'+lv.toFixed(1)+'</text>';
  });
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" role="img">'+g+'</svg>' +
    '<div class="legend">' + series.map(s=>'<span><i style="background:'+s.color+'"></i>'+s.label+'</span>').join("") +
    (opts.targetLabel ? '<span><i style="background:#c0392f"></i>'+opts.targetLabel+'</span>' : '') + '</div>';
}
const COL = { ink:"#ffffff", ox:"#FF453A", green:"#30D158", blue:"#0A84FF", brass:"#FF9F0A", plum:"#BF5AF2", soft:"rgba(255,255,255,.45)" };
const chartBox = (title, cap, body) => '<div class="chartbox"><h3>'+title+'</h3><div class="cap">'+cap+'</div>'+body+'</div>';
const col = k => G.log.map(r=>r[k]);

function compositionBar(){
  const E = aggregate(G.draft), rev = revenue(G.draft, E);
  const groups = { income:0, consumption:0, corporate:0, wealth:0, vice:0 };
  for(const id in rev.by){ groups[taxGroup(id)] += rev.by[id]; }
  groups.other = rev.other;
  const names = { income:"Income tax and NI", consumption:"Consumption", corporate:"Corporate", wealth:"Capital & land", vice:"Duties on regulated goods", other:"Other receipts" };
  const cols = { income:COL.ink, consumption:COL.brass, corporate:COL.blue, wealth:COL.plum, vice:COL.green, other:COL.soft };
  const total = Object.values(groups).reduce((a,b)=>a+b,0) || 1;
  let x = 0, bar = "";
  for(const k in groups){
    const wdt = groups[k]/total*100;
    bar += '<rect x="'+x.toFixed(2)+'%" y="0" width="'+wdt.toFixed(2)+'%" height="22" fill="'+cols[k]+'"/>';
    x += wdt;
  }
  return '<svg viewBox="0 0 100 22" width="100%" height="22" preserveAspectRatio="none">'+bar+'</svg>' +
    '<div class="legend">' + Object.keys(groups).map(k=>'<span><i style="background:'+cols[k]+'"></i>'+names[k]+' '+groups[k].toFixed(1)+'</span>').join("") + '</div>';
}

function globeFallbackHtml(){
  let img = "";
  try { img = '<img alt="Map of the world of {C}" src="'+worldCanvas().toDataURL("image/png")+'">'; }
  catch(err){ img = ""; }
  return '<div class="globe-fallback">'+img+
    '<p>3D globe unavailable here, so this is the flat map. Everything else in the game is unaffected.</p></div>';
}

/* Share of GDP, indexed to inflation, or pegged to a service standard. */
/* Us against the rest of the world, on the numbers a Chancellor is judged on. */
function nationTableHtml(){
  const e = G.econ, n = e.nations || {};
  const last = G.log.length ? G.log[G.log.length-1] : null;
  const rows = [{
    name: G.country, growth: last ? last.growth : 0, debt: e.debt,
    deficit: last ? -last.balance : 0, inflation: e.inflation, us: true
  }].concat(PARTNERS.filter(p=>n[p.id]).map(p=>({
    name: p.name, growth: n[p.id].growth, debt: n[p.id].debt,
    deficit: n[p.id].deficit, inflation: n[p.id].inflation
  })));
  rows.sort((a,b)=>b.growth - a.growth);
  const cell = (v,d,inv) => '<td class="'+((inv? -v : v) > 0 ? "pos" : (inv? -v : v) < 0 ? "neg" : "")+'">'+fmt(v,d)+'</td>';
  return '<div class="ledger-wrap"><table class="ledger">' +
    '<thead><tr><th>Country</th><th>Growth</th><th>Inflation</th><th>Deficit</th><th>Debt</th></tr></thead><tbody>' +
    rows.map(r=>'<tr'+(r.us?' style="background:rgba(10,132,255,.16)"':'')+'>' +
      '<td>'+esc(r.name)+(r.us?' &middot; you':'')+'</td>' +
      cell(r.growth,1) + '<td>'+r.inflation.toFixed(1)+'</td>' +
      cell(-r.deficit,1) + '<td>'+r.debt.toFixed(0)+'</td></tr>').join("") +
    '</tbody></table></div>';
}

function budgetModeHtml(d, transferOnly){
  const cur = (G.draft.mode || {})[d.id] || "share";
  const opts = transferOnly
    ? [["share","Share of GDP"],["real","With inflation"]]
    : [["share","Share of GDP"],["real","With inflation"],["service","Hold service level"]];
  return '<div class="seg mini" style="margin-top:6px">' + opts.map(o=>
    '<button data-mode="'+d.id+'" data-modeval="'+o[0]+'" aria-pressed="'+(o[0]===cur)+'">'+
    o[1]+'</button>').join("") + '</div>';
}

function dealBlockers(d){
  const out = [], D = G.draft, n = d.need || {};
  if(n.relation && G.rel[d.partner] < n.relation) out.push("relations below " + n.relation);
  if(n.deal && !D.deals[n.deal]) out.push("requires " + DEAL_BY_ID[n.deal].name.toLowerCase());
  (n.policyOff||[]).forEach(p=>{ if(D.policies[p]) out.push("incompatible with " + POLICY_BY_ID[p].name.toLowerCase()); });
  (n.policyOn||[]).forEach(p=>{ if(!D.policies[p]) out.push("requires " + POLICY_BY_ID[p].name.toLowerCase()); });
  (n.taxOff||[]).forEach(t=>{ if(D.taxes[t].on) out.push("requires abolishing the " + TAX_BY_ID[t].name.toLowerCase()); });
  if(n.tariffMax != null && D.tariff > n.tariffMax) out.push("tariff must be " + n.tariffMax + "% or lower");
  for(const k in (n.deptMin||{})) if(D.spend[k] < n.deptMin[k]) out.push(k + " spending must be at least " + n.deptMin[k] + "%");
  return out;
}

function ledgerTable(){
  if(!G.log.length) return '<div class="empty">No quarters recorded. Set out a bill and deliver it.</div>';
  const rows = G.log.slice(-12).map(r=>{
    const c = (v,d)=>'<td class="'+(v>0?"pos":v<0?"neg":"")+'">'+fmt(v,d)+'</td>';
    return '<tr><td>'+r.label+'</td>'+c(r.growth,1)+'<td>'+r.inflation.toFixed(1)+'</td><td>'+r.unemployment.toFixed(1)+'</td>' +
      c(r.balance,1)+'<td>'+r.debt.toFixed(0)+'</td><td>'+r.yield.toFixed(2)+'</td><td>'+r.approval.toFixed(0)+'</td><td>'+Math.round(r.capital)+'</td></tr>';
  }).join("");
  return '<table class="ledger"><thead><tr><th>Quarter</th><th>Growth</th><th>Inflation</th><th>Unemp.</th><th>Balance</th><th>Debt</th><th>Yield</th><th>Approval</th><th>Capital</th></tr></thead><tbody>'+rows+'</tbody></table>';
}

}

function despatch(title, stamp, html, opts, cfg){
  const preview = cfg && cfg.preview && G.sandbox;
  let base = null;
  if(preview){ try{ base = simulate(G.law, 4); }catch(err){ base = null; } }
  $("dpTitle").textContent = T(title);
  $("dpStamp").textContent = stamp;
  $("dpBody").innerHTML = T(html);
  const box = $("dpOpts");
  box.innerHTML = "";
  opts.forEach(o=>{
    const b = document.createElement("button");
    b.className = "opt";
    let extra = "";
    if(preview && base){
      const im = previewOption({ f:o.preview || o.f }, base);
      if(im) extra = impactChips(im) + impactFactions(im);
    }
    b.innerHTML = "<b>"+T(esc(o.b))+"</b>" + (o.e ? "<em>"+T(esc(o.e))+"</em>" : "") + extra;
    b.onclick = ()=>{ $("scrim").hidden = true; o.f(); };
    box.appendChild(b);
  });
  $("scrim").hidden = false;
  setTimeout(()=>{ const f = box.querySelector(".opt"); if(f) f.focus(); }, 40);
}

function rollEvent(){
  if(G.q - G.lastEventQ < 4) return null;      // at least four clear quarters
  if(Math.random() > 0.20) return null;        // and only occasionally even then
  const pool = EVENTS.filter(e => e.cond() && e.id !== G.lastEventId);
  if(!pool.length) return null;
  let total = pool.reduce((a,e)=>a+e.w,0), r = Math.random()*total;
  for(const e of pool){ r -= e.w; if(r <= 0) return e; }
  return pool[0];
}

function writeBriefing(res){
  const e = G.econ, b = [], E = res.E;
  if(res.growth < -0.5) b.push("The economy contracted this quarter. Expect the word recession in tomorrow's papers.");
  else if(res.growth > res.pg + 1.2) b.push("Output is running well ahead of what the economy can sustainably produce.");
  else if(res.growth > 0.4) b.push("Modest growth, broadly in line with trend.");
  else b.push("Growth has stalled. Nothing dramatic, just nothing happening.");

  if(e.inflation > 8) b.push("Inflation at " + e.inflation.toFixed(1) + "% is out of control, and wage demands are following it up.");
  else if(e.inflation > 4) b.push("Inflation is " + e.inflation.toFixed(1) + "%, and the Bank has taken rates to " + e.rate.toFixed(2) + "%.");
  else if(e.inflation < 0.5) b.push("Prices are barely moving. The Bank is more worried about deflation than you are.");

  if(e.yield > 7) b.push("Gilt yields hit " + e.yield.toFixed(1) + "%. The market is pricing in the possibility that you cannot pay.");
  else if(e.debt > 130) b.push("Debt is " + e.debt.toFixed(0) + "% of GDP, and interest alone costs " + res.sp.interest.toFixed(1) + "% of national income.");

  if(E.blackLevel > 34) b.push("Roughly " + E.blackLevel.toFixed(0) + "% of the trade in what you regulate now happens outside the law, and outside the tax base.");
  if(e.services < 35) b.push("Waiting lists and class sizes are the front page most mornings now.");
  if(e.unemployment > 8) b.push("Unemployment at " + e.unemployment.toFixed(1) + "% is the number your backbenchers quote at you.");

  const worst = FACTIONS.slice().sort((a,b2)=>G.fac[a.id]-G.fac[b2.id])[0];
  if(G.fac[worst.id] < 30) b.push(worst.name.toLowerCase() + " have effectively abandoned you, and they are " + Math.round(worst.w*100) + "% of the electorate.");
  if(G.capital < 12) b.push("You have almost no political capital left. Ambitious legislation is off the table until that recovers.");
  G.brief = b.slice(0,3).map(T);
}

function checkCrises(res){
  const e = G.econ;
  if(e.yield > 10 && e.debt > 118)
    return gameOver("F","The market closed the door",
      "{C} could not roll over its debt at any price you were willing to pay. An emergency programme was agreed with the international lender of last resort, and its conditions were not written in this building.");
  if(e.inflation > 22)
    return gameOver("F","Prices ran away",
      "Inflation above twenty percent stopped being an economic statistic and became a political one. Savings evaporated, indexation spread, and the government fell before you could unwind any of it.");
  const appr = approvalOf(G.fac);
  G.lowRun = appr < 20 ? G.lowRun + 1 : 0;
  if(G.lowRun >= 4)
    return gameOver("E","Your own side removed you",
      "Four straight quarters below twenty percent. The letters went in, the meeting was short, and you were offered a peerage on the way out.");
}

function grade(){
  const e = G.econ;
  let s = 0;
  s += clamp((e.gdp/e.potential - 1)*10 + 3, 0, 6);
  s += clamp(6 - Math.abs(e.inflation - 2)*1.2, 0, 6);
  s += clamp(6 - (e.unemployment - 4)*1.1, 0, 6);
  s += clamp(6 - (e.debt - 90)*0.06, 0, 6);
  s += clamp((e.services - 35)*0.15, 0, 6);
  s += clamp((approvalOf(G.fac) - 25)*0.14, 0, 6);
  s += clamp((e.liberty - 30)*0.09, 0, 6);
  s += clamp(6 - (e.gini - 28)*0.22, 0, 6);
  const pct = s/48;
  return pct > 0.80 ? "A" : pct > 0.66 ? "B" : pct > 0.50 ? "C" : pct > 0.34 ? "D" : "E";
}

function gameOver(g, title, text){
  /* Sandbox keeps you in office. The crisis still happened and the briefing
     still says so; you simply are not removed for it. */
  if(G.sandbox){
    G.brief = [title + ". In another government this would have ended you, but you are still here.",
               text].concat(G.brief).slice(0,3);
    G.lowRun = 0;
    G.econ.riskPremium = Math.min(G.econ.riskPremium, 0.4);
    return;
  }
  G.over = true;
  const e = G.econ;
  const rows = [
    ["Quarters served", G.q], ["Terms", G.term],
    ["Output vs potential", fmt((e.gdp/e.potential - 1)*100,1) + "%"],
    ["Inflation", e.inflation.toFixed(1) + "%"], ["Unemployment", e.unemployment.toFixed(1) + "%"],
    ["Debt", e.debt.toFixed(0) + "% of GDP"], ["Public services", e.services.toFixed(0) + " / 100"],
    ["Civil liberty", e.liberty.toFixed(0) + " / 100"], ["Inequality", e.gini.toFixed(1) + " Gini"],
    ["Final approval", approvalOf(G.fac).toFixed(0) + "%"]
  ].map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>').join("");
  despatch(title, "Verdict",
    '<div class="verdict"><div class="grade">'+g+'</div><div class="lede">'+text+'</div><table>'+rows+'</table></div>',
    [{ b:"Form a new government", e:"Start again from the beginning", f:()=>newGame() }]);
  render();
}

function election(){
  if(G.over) return;
  const e = G.econ;
  const recent = G.log.slice(-8);
  const record = (recent.reduce((a,r)=>a+r.growth,0)/recent.length)*2.5
               - Math.max(0, e.inflation - 3)*1.5 - (e.unemployment - 4.2)*1.5 + (e.services - 55)*0.15;
  const score = approvalOf(G.fac) + record;
  if(score <= 44 && !G.sandbox)
    return gameOver(grade(), "You lost the election",
      "The country had a view and expressed it. Your successor inherits debt at " + e.debt.toFixed(0) +
      "% of GDP, inflation at " + e.inflation.toFixed(1) + "% and a note in the desk drawer you had better hope was polite.");
  G.term++;
  G.capital = clamp(G.capital + 22, 0, 100);
  const held = score <= 44;
  despatch(held ? "Returned on a technicality" : "Returned to office", "General election",
    (held
      ? "<p>On these numbers the country would have thrown you out. Sandbox mode is on, so you are returned anyway, with a majority you have not earned.</p>"
      : "<p>The government is returned with a working majority. You keep the red box, the debt and the demographic arithmetic.</p>") +
    "<p>A fresh mandate is worth real political capital. Spend it on something that outlasts you.</p>",
    [{ b:"Continue", e:"Term " + G.term + " begins", f:()=>render() }]);
}

/* ---------- sandbox impact analysis ---------- */
const IMP_NAMES = { pot:"trend growth", gro:"demand", inf:"inflation", gini:"inequality",
  srv:"services", lib:"liberty", cri:"crime", hlt:"public health", env:"environment",
  nairu:"structural unemployment", eva:"evasion", blk:"black market", rev:"receipts",
  spend:"spending", open:"openness", resilience:"shock resilience", trade:"trade relations",
  pc:"political capital" };

function fullEffects(imp, fac, cost){
  const bits = [];
  if(cost) bits.push('<b>'+(cost>0?"costs ":"saves ")+Math.abs(cost).toFixed(2)+'% GDP</b>');
  for(const k in (imp||{})){
    if(!imp[k]) continue;
    bits.push((IMP_NAMES[k]||k) + " " + sgn(imp[k], Math.abs(imp[k]) < 1 ? 2 : 1));
  }
  const f = Object.entries(fac||{}).filter(e=>e[1]).sort((a,b)=>b[1]-a[1]);
  const facTxt = f.map(([k,v])=>cap1(k)+" "+sgn(v,1)).join(", ");
  return '<div class="eff">'+bits.join(" &middot; ")+'</div>' +
         (facTxt ? '<div class="eff" style="color:var(--ink-faint)">'+facTxt+'</div>' : '');
}

function impactChips(im){
  return '<div class="impchips">' + IMPACT_ROWS.map(r=>{
    const v = im.head[r.k];
    if(Math.abs(v) < 0.005) return '';
    const better = r.good === "up" ? v > 0 : v < 0;
    return '<span class="'+(better?"up":"dn")+'">'+r.name+' '+sgn(v, r.dp)+'</span>';
  }).filter(Boolean).join("") + '</div>';
}

function impactFactions(im){
  const f = Object.entries(im.fac).sort((a,b)=>b[1]-a[1]).filter(e=>Math.abs(e[1]) > 0.05);
  if(!f.length) return '<div class="impfac">No faction moves enough to notice.</div>';
  const best = f[0], worst = f[f.length-1];
  return '<div class="impfac">' +
    (best[1] > 0 ? '<span class="up">'+cap1(best[0])+' '+sgn(best[1],1)+'</span>' : '') +
    (worst[1] < 0 ? '<span class="dn">'+cap1(worst[0])+' '+sgn(worst[1],1)+'</span>' : '') +
    (Math.abs(im.gini) > 0.05 ? '<span class="'+(im.gini<0?"up":"dn")+'">Inequality '+sgn(im.gini,2)+'</span>' : '') +
    '</div>';
}

/* What an event option would actually do. Options mutate the game directly, so
   this snapshots every mutable field, runs the option, measures, then puts it
   all back. A test asserts the state is byte-identical afterwards. */
const MUTABLE = ["econ","fac","rel","mods","law","draft","capital","brief","q","term","over","lowRun","sandbox","rateManual","manualRate","country"];
function previewOption(opt, base){
  const snap = {};
  MUTABLE.forEach(k=>{ snap[k] = clone(G[k]); });
  let im = null;
  try{
    opt.f();
    im = impactOf(clone(G.law), base, 4);
  } catch(err){ im = null; }
  MUTABLE.forEach(k=>{ G[k] = snap[k]; });
  return im;
}

/* A running total for whatever is staged, shown at the top of every drawer so
   you can see the consequence of a change without leaving the panel you made it
   in. Cheap: one baseline plus one variant simulation. */
function impactStripHtml(){
  if(!G.sandbox) return '';
  const cl = billClauses();
  if(!cl.length)
    return '<div class="impstrip empty">Nothing staged. Change anything here and its full effect appears in this strip.</div>';
  let im;
  try{ im = impactOf(clone(G.draft), simulate(G.law, 4), 4); }
  catch(err){ return ''; }
  return '<div class="impstrip"><div class="impstrip-h">Staged: ' + cl.length + ' change' +
    (cl.length===1?'':'s') + ' &middot; ' + cl.reduce((a,c)=>a+c.pc,0) + ' capital ' +
    '<button class="btn tiny" data-gobill="1">Break it down</button></div>' +
    impactChips(im) + impactFactions(im) + '</div>';
}

/* Every clause on its own, four quarters out, against passing nothing. */
function impactPanelHtml(cl){
  if(!cl.length) return '';
  const base = simulate(G.law, 4);
  let h = '<div class="eyebrow mt">What each clause does on its own</div>' +
    '<div class="hint">Sandbox only. Each block is that clause alone over four quarters, measured against passing nothing at all. ' +
    'Growth is cumulative GDP over the path, not the final quarter\'s pace. ' +
    'They will not add up to the whole bill, because these things interact.</div>';
  cl.forEach((c,i)=>{
    const im = impactOf(lawWithOnlyClause(i), base, 4);
    h += '<div class="impblock"><div class="imphead">'+esc(c.label)+
         '<span class="cost">'+c.pc+' cap</span></div>' +
         (Math.abs(im.revenue) > 0.005
           ? '<div class="impfac"><span class="'+(im.revenue>0?"up":"dn")+'">Receipts on impact '+sgn(im.revenue,2)+' pts</span></div>'
           : '') +
         impactChips(im) + impactFactions(im) + '</div>';
  });
  if(cl.length > 1){
    const whole = impactOf(clone(G.draft), base, 4);
    h += '<div class="impblock whole"><div class="imphead">The bill as a whole' +
         '<span class="cost">'+cl.reduce((a,c)=>a+c.pc,0)+' cap</span></div>' +
         impactChips(whole) + impactFactions(whole) + '</div>';
  }
  return h;
}

function projectionModal(){
  const cl = billClauses(), cost = cl.reduce((a,c)=>a+c.pc,0);
  const truth = project(4);
  const p = withForecastError(truth);
  const warn = projectionWarnings(truth);
  const rows = p.rows.map(r=>
    '<tr><td>'+r.label+'</td>' +
    '<td class="'+(r.growth>0?"pos":"neg")+'">'+fmt(r.growth,1)+'</td>' +
    '<td>'+r.inflation.toFixed(1)+'</td><td>'+r.unemployment.toFixed(1)+'</td>' +
    '<td class="'+(r.balance>=0?"pos":"neg")+'">'+fmt(r.balance,1)+'</td>' +
    '<td>'+r.debt.toFixed(0)+'</td><td>'+r.yield.toFixed(2)+'</td><td>'+r.approval.toFixed(0)+'</td></tr>').join("");

  const cur = balanceOf(G.law, G.econ).balance, draftBal = balanceOf(G.draft, G.econ).balance;
  const body =
    '<p style="color:var(--ink-soft);font-size:13px">Independent four-quarter forecast on the assumption this bill passes unchanged and nothing else happens. Something else always happens.</p>' +
    '<div class="proj"><table><thead><tr><th>Quarter</th><th>Growth</th><th>Infl.</th><th>Unemp.</th><th>Balance</th><th>Debt</th><th>Yield</th><th>Appr.</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
    '<div style="margin-top:12px;font-family:var(--mono);font-size:11.5px;color:var(--ink-soft)">' +
      'Balance on delivery ' + fmt(draftBal,1) + '% of GDP (' + sgn(draftBal - cur,1) + ' versus current law) &middot; ' +
      cl.length + ' clause' + (cl.length===1?"":"s") + ' &middot; ' + cost + ' of ' + Math.round(G.capital) + ' capital' +
    '</div>' +
    '<ul class="warnlist">' + warn.map(w=>'<li>'+esc(w)+'</li>').join("") + '</ul>' +
    '<div class="hint" style="margin-top:12px">' + (p.exact
      ? 'Sandbox: this forecast is exact. It is the model itself, so the outturn will match it unless something else happens.'
      : 'This is a forecast, not a promise. Independent forecasts of borrowing miss by about a point of GDP a year out, ' +
        'and by more on growth. The figures above carry an error of that size, so the outturn will not match them. ' +
        'Turn on sandbox in the bill panel for an exact one.') + '</div>';

  despatch(cl.length ? "Forecast for this bill" : "Forecast on current policy", "Office for Budget Responsibility", body,
    [ { b:"Confirm and deliver", e:"Enact every clause and move to the next quarter", f:()=>enact() },
      { b:"Go back and change it", e:"Return to the bill with nothing enacted", f:()=>render() } ]);
}

function enact(){
  if(G.over) return;
  const cl = billClauses(), cost = cl.reduce((a,c)=>a+c.pc,0);
  if(cost > G.capital) return;
  G.capital -= cost;
  G.prevLaw = clone(G.law);
  G.law = clone(G.draft);

  const ev = rollEvent();
  const proceed = ()=>{
    const res = step(G, G.law, G.prevLaw, false);
    G.draft = clone(G.law);
    writeBriefing(res);
    checkCrises(res);
    render();
    if(!G.over && G.q > 0 && G.q % TERM_LEN === 0) election();
  };
  if(ev){
    G.lastEventQ = G.q; G.lastEventId = ev.id;
    despatch(ev.title, ev.stamp, "<p>"+ev.text+"</p>",
      ev.opts.map(o=>({ b:o.b, e:o.e, f:()=>{ o.f(); proceed(); }, preview:o.f })),
      { preview:true });
  } else proceed();
}

/* Name your own country: the label in the bar swaps to a field in place. */
(function wireRename(){
  const btn = $("nameBtn");
  if(!btn) return;
  btn.onclick = ()=>{
    const input = document.createElement("input");
    input.type = "text"; input.id = "nameInput"; input.value = G.country;
    input.maxLength = 34; input.setAttribute("aria-label", "Name of your country");
    const commit = ()=>{
      const v = (input.value || "").trim();
      G.country = v || "The Kingdom";
      if(input.parentNode) input.parentNode.replaceChild(btn, input);
      render();
    };
    input.addEventListener("keydown", ev=>{
      if(ev.key === "Enter"){ ev.preventDefault(); commit(); }
      if(ev.key === "Escape"){ ev.preventDefault(); if(input.parentNode) input.parentNode.replaceChild(btn, input); }
    });
    input.addEventListener("blur", commit);
    if(btn.parentNode) btn.parentNode.replaceChild(input, btn);
    input.focus(); input.select();
  };
})();


</script>
</body>
</html>
