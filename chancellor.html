let G, tab = null;   // null = the map, undisturbed

function baseLaw(){
  return {
    regime:"progressive",
    taxes:Object.fromEntries(TAXES.map(t=>[t.id,{on:!!t.on, rate:t.def}])),
    spend:Object.fromEntries(DEPTS.map(d=>[d.id,d.def])),
    income: clone(DEF_INCOME),
    ni: Object.assign({}, DEF_NI),
    policies:{},
    vice:{cannabis:"banned", psychedelics:"banned", gambling:"legal", alcohol:"legal", tobacco:"legal", adult:"banned"},
    deals:{},
    hold:{},
    mode:{},
    tariff:3
  };
}

function newGame(){
  G = {
    q:0, term:1, over:false, sandbox:true, rateManual:false, manualRate:3.75,
    country:"The Kingdom", capital:42, log:[], mods:[], brief:[],
    lastEventQ:-3, lastEventId:null, lowRun:0, ruleBreaches:0,
    econ:{ gdp:100, potential:100, inflation:3.2, expect:2.6, unemployment:4.9,
           rate:3.75, effInterest:3.3, yield:5.05, debt:94, riskPremium:0, supplyShock:0,
           vatEcho:0, carry:[0,0], demandNeed:0, services:55, gini:35, wageIndex:1,
           erBorne:0, erBornePrev:0,
           C:SHARE_C, I:SHARE_I, X:SHARE_X, M:SHARE_M,
           K:K0, A:A0, L:100, nairu:U_STAR, trendGrowth:1.2, Kstar:K0, userCost:UC_BASE, ucSmooth:UC_BASE,
           fx:1, dependency:DEP_0, pubProd:1, realWage:1, participation:1,
           KG:KG0, permInc:59.6, rtShare:RULE_OF_THUMB, credibility:0.6,
           baseConsumption:1, baseWages:1, baseProfits:1, baseProfitsRaw:1,
           baseAssets:1, baseAssetsRaw:1, assetPrice:1, fuelVolume:1, profitShare:1,
           profitShift:1, blendedRate:3.3, privateWealth:0, welfareRatchet:0, retaliation:0, tradeDepth:0,
           balPrivate:0, balGovt:0, balForeign:0, balResidual:0,
           worldY:100, worldP:1, priceP:1, worldShock:0,
           liberty:58, crime:42, health:55, env:44, openness:50, fund:0 },
    fac:{ business:50, workers:48, pensioners:52, urban:47, rural:49, patriots:45 },
    rel:{ continental:50, federated:58, eastern:44, commonwealth:56, gulf:50 },
    law:baseLaw()
  };
  G.prevLaw = clone(G.law);
  G.draft = clone(G.law);
  G.brief = [
    "You have the keys to the Treasury. Growth is thin, prices are still running hot, and debt is the highest in a generation.",
    "The Bank sets interest rates, not you. The statute book is yours: rates, structures, laws, treaties. All of it costs political capital, and you start with very little."
  ];
  /* ---- Settle the opening position ----
     The published shares are not a solution of the equations at the opening
     rate, inflation and tax settings, so left alone the model spent its first
     year correcting that. It showed up as a recession the player had done
     nothing to cause, which is the worst kind of opening.

     The whole system is therefore run forward until it stops moving, and only
     then are the stocks and the headline readings set to their published
     values. What the player inherits is a real economy in equilibrium carrying
     Britain's actual debt, deficit and inflation, rather than a set of numbers
     that happen to be true individually and inconsistent together. */
  for(let i=0;i<48;i++) step(G, G.law, G.law, true);
  const k = 100 / G.econ.gdp;
  ["gdp","C","I","X","M","K","KG","permInc","worldY"].forEach(key=>{ G.econ[key] *= k; });

  Object.assign(G.econ, {
    debt:94, effInterest:3.3, yield:4.6, inflation:2.9, expect:2.5, credibility:0.62,
    riskPremium:0, fx:1, worldP:1, priceP:1,
    /* The burn-in uprates wages and thresholds as it runs. Left in place that
       would hand the player four decades of accumulated fiscal drag before the
       first turn, so the wage index and the tax code are returned to their
       published starting values. */
    wageIndex:1, realWage:1, pubProd:1, dependency:DEP_0,
    L:100, participation:1,
    /* The burn-in runs the whole model, including everyone else's books, so the
       rest of the world would otherwise start the game having already run four
       decades of deficits. Regions and rival economies are re-initialised. */
    nations:null, regions:null, prevX:null, prevG:null, welfareRatchet:0, retaliation:0, tradeDepth:0
  });
  G.econ.regions = initRegions(G.econ);
  G.law.income = clone(DEF_INCOME);
  G.law.ni = clone(DEF_NI);
  /* Re-solve total factor productivity so the settled capital stocks and a
     labour force of 100 give potential output of exactly 100. */
  G.econ.A = 1;
  G.econ.A = 100 / potentialLevel(G.law, aggregate(G.law), G.econ);
  G.econ.potential = 100;
  G.econ.gdp = 100;
  G.q = 0; G.term = 1; G.log = []; G.mods = []; G.over = false;
  G.prevLaw = clone(G.law);
  G.draft = clone(G.law);

  tab = null;
  render();
}

/* ---- Consumption: Campbell-Mankiw ----
   Two kinds of household. A rule-of-thumb share is liquidity-constrained and
   simply spends its disposable income; the rest smooth against permanent income
   and respond to the real interest rate.

       C = lambda * YD_constrained + (1-lambda) * C_permanent

   This is what makes the *distribution* of a fiscal change matter for demand,
   not only for fairness: money given to constrained households is spent, the
   same money given to unconstrained households is largely saved. With a single
   MPC, as before, redistribution had no effect on aggregate demand at all. */
const RULE_OF_THUMB = 0.40;   // share of households spending current income
const MPC_RT = 0.95;          // constrained households spend nearly all of it
const MPC_PERM = 0.42;        // the rest smooth
const PERM_ADJ = 0.09;        // speed at which permanent income updates
/* Constrained households take a smaller share of market income than of
   transfers, which is why a pound of welfare moves demand more than a pound of
   basic-rate tax cut. */
const RT_MARKET_SHARE = 0.26, RT_TRANSFER_SHARE = 0.66;
const REDIST_SENS = 0.5;      // a more equal distribution raises the constrained share
/* Amplifies the distributional signal into the constrained share. The raw
   spread in aggregate MPC across plausible tax settings is only a point or two,
   which is realistic but too quiet to feel, so it is levered up here. */
const MPC_INCIDENCE = 0.8, MPC_DIST_BASE = 0.4661;

/* Investment is neoclassical rather than a reduced form. Firms have a desired
   capital stock given by the first-order condition of a Cobb-Douglas production
   function, MPK = user cost:

       alpha * Y / K = uc      =>      K* = alpha * Y / uc

   Investment covers depreciation and trend growth, plus partial adjustment
   toward any gap between desired and actual capital. Corporation tax and the
   policy rate enter through the user cost,

       uc = real rate + depreciation + corporate tax wedge

   which is where they actually bite. Investment then accumulates into the
   capital stock, and the capital stock is an argument of potential output, so a
   decade of weak investment shows up as weak supply instead of being forgotten. */
const ALPHA = 0.33;          // capital share of income
const DEPREC = 5.0;          // annual depreciation of the capital stock, %
const CORP_WEDGE = 0.027;    // points of user cost per point of corporation tax
const K_ADJ = 0.05;          // annual speed of adjustment toward desired capital
/* Desired capital is unit-elastic to the user cost under Cobb-Douglas, which at
   quarterly frequency makes investment whipsaw on every move in the policy rate.
   Firms plan against a smoothed cost of capital instead. */
const UC_SMOOTH = 0.07;
const I_ACCEL = 0.10;        // short-run accelerator on top of the stock model
const K0 = 300;              // private capital stock, about three times annual output
/* Public capital is a separate factor of production. Infrastructure spending
   accumulates into it rather than being credited to TFP through a fudge, and it
   depreciates more slowly than private capital because it is mostly structures. */
const KG0 = 70;              // public capital stock, roughly 0.7 of annual output
const ALPHA_G = 0.09;        // output elasticity of public capital
const DEPREC_G = 3.2;        // annual depreciation of public capital, %
/* The bare first-order condition implies more capital than firms actually hold,
   because of adjustment costs, risk premia and mark-ups. This scales K* so that
   the baseline economy sits in steady state. */
/* Anchored on the long-run real rate, not the opening one. The game starts with
   inflation above target and policy therefore restrictive, so desired capital
   starts below its steady state and investment is weak until the Bank can ease.
   That is the position the UK is actually in. */
const UC_BASE = (3.4 - 2.0) + DEPREC + 25*CORP_WEDGE;
const KSTAR_SCALE = K0 / (ALPHA * 100 / (UC_BASE / 100));

/* ==================================================================
   3. AGGREGATION  (what the statute book does to the country)
   ================================================================== */

function taxAvailable(t, law){
  if(!t.req) return true;
  const [viceId, ...allowed] = t.req;
  return allowed.includes(law.vice[viceId]);
}

function aggregate(law){
  /* `ch` carries effects that act through a real channel: labour supply, the
     capital stock, productivity, the cost of capital, the replacement ratio,
     market access. Those reach output the way the thing they describe actually
     would. `imp` is kept only for the social indicators, which are a game layer
     with no macro channel to run through. */
  const E = { pot:0, gro:0, inf:0, gini:0, srv:0, lib:0, cri:0, hlt:0, env:0,
              nairu:0, eva:0, blk:0, rev:0, spend:0, open:0, resilience:0, trade:0,
              part:0, labour:0, tfp:0, ucost:0, replace:0, mpcw:0, kboost:0,
              access:0, tariffCut:0,
              fac:{business:0,workers:0,pensioners:0,urban:0,rural:0,patriots:0} };
  const add = (imp, fac, k=1, ch) => {
    if(imp) for(const key in imp) if(key in E) E[key] += imp[key]*k;
    if(ch)  for(const key in ch)  if(key in E) E[key] += ch[key]*k;
    if(fac) for(const f in fac) if(f in E.fac) E.fac[f] += fac[f]*k;
  };
  const R = REGIME_BY_ID[law.regime];
  add(R.imp, R.fac);

  for(const t of TAXES){
    const s = law.taxes[t.id];
    if(!s || !s.on || !taxAvailable(t, law)) continue;
    if(R.kills && R.kills.includes(t.id)) continue;
    add(t.imp, t.fac, s.rate - t.def);
  }
  add({inf:0.020, pot:-0.012, open:-0.55},
      {patriots:0.55, business:-0.38, rural:0.30, urban:-0.20}, law.tariff);

  for(const id in law.policies){
    if(!law.policies[id]) continue;
    const p = POLICY_BY_ID[id]; if(!p) continue;
    add(p.imp, p.fac, 1, p.ch);
    E.spend += p.cost || 0;
    if(p.resilience) E.resilience += p.resilience;
    if(p.trade) E.trade += p.trade;
  }
  for(const v of VICE){
    const st = v.states.find(s => s.id === law.vice[v.id]);
    if(st) add(st.imp, st.fac);
  }
  for(const id in law.deals){
    if(!law.deals[id]) continue;
    const d = DEAL_BY_ID[id]; if(!d) continue;
    add(d.imp, d.fac, 1, d.ch);
    if(d.resilience) E.resilience += d.resilience;
  }
  E.blackLevel = clamp(10 + E.blk, 0, 78);
  return E;
}

/* How far a tax's own base has moved from its opening level. */
function taxBaseIndex(t, econ){
  if(!econ || !t.basis) return 1;
  switch(t.basis){
    case "consumption": return clamp(econ.baseConsumption || 1, 0.4, 2.2);
    case "wages":       return clamp(econ.baseWages || 1, 0.4, 2.2);
    case "profits":     return clamp(econ.baseProfits || 1, 0.2, 3.0);
    case "assets":      return clamp(econ.baseAssets || 1, 0.2, 3.0);
    case "volume":      return clamp(econ.fuelVolume || 1, 0.1, 1.5);
    default: return 1;
  }
}

/* Aggregate MPC implied by how post-tax income is distributed. */
function distMPC(law, econ){
  const p = incomeProfile(law, econ);
  return p.distMPC;
}

function revenue(law, E, econ){
  const R = REGIME_BY_ID[law.regime], mult = R.mult || {};
  const by = {}; let total = 0;
  for(const t of TAXES){
    const s = law.taxes[t.id];
    if(!s || !s.on || !taxAvailable(t, law)) continue;
    if(R.kills && R.kills.includes(t.id)) continue;
    let base = t.base * (mult[t.grp] || 1);
    if(t.grp === "vice") base *= 1 - E.blackLevel/100;
    base *= taxBaseIndex(t, econ);
    const y = Math.max(0, s.rate * base * baseResponse(s.rate, t.def, t.eti)
                          * (1 - clamp(E.eva,-0.7,0.7)*0.05));
    by[t.id] = y; total += y;
  }
  const inc = incomeYield(law, E, econ || (typeof G !== "undefined" && G ? G.econ : null));
  by.incomeTax = inc.income; by.niEmployee = inc.employee; by.niEmployer = inc.employer;
  total += inc.total;
  const other = OTHER_REV + E.rev + law.tariff * 0.055;
  return { total: total + other, by, other, inc };
}

/* The welfare line is generosity, not a total. What it costs depends on how many
   people are claiming, and that moves with the cycle: roughly 0.3 points of GDP
   for every point of unemployment above equilibrium, which is the size of the
   UK's cyclical welfare bill. This is the automatic stabiliser working on the
   spending side, and it means a recession widens the deficit whether or not the
   Chancellor does anything. */
const CYCLICAL_WELFARE = 0.30;
/* Receipts are about 1.3 times as elastic as output over the cycle. */
const REV_GAP_ELAST = 0.30;

/* ---- Tax bases are not GDP ----
   Every tax here used to sit on a base proportional to output, which is the
   crudest thing left in the revenue model. They sit on different aggregates and
   those aggregates move very differently over a cycle:

     consumption   VAT and the duties, which track C rather than Y
     wages         income tax and NI, which track the wage bill
     profits       corporation tax, on the most cyclical base there is
     assets        capital gains, inheritance and transaction taxes, which
                   track asset prices and therefore move inversely with rates
     volume        fuel duty, on a base that shrinks as engines improve

   The profit share swings two to three times as hard as output, which is why
   corporation tax receipts collapse in a recession and overshoot in a boom.
   Asset prices are discounted at the real rate, so a tightening cycle takes
   capital gains receipts with it. And fuel duty sits on a physically declining
   base, which is a real fiscal problem rather than a modelling curiosity. */
const PROFIT_CYC = 2.6;        // profit share elasticity to the output gap
const ASSET_RATE = 7.5;        // asset price sensitivity to the real rate
const ASSET_ADJ = 0.22;
const FUEL_EROSION = 1.6;      // annual decline in the fuel base, %
const CARBON_EROSION = 0.05;   // extra decline per point of carbon price
const CORP_LAG = 0.30;         // corporation tax is paid in arrears
const CGT_LAG = 0.25;
function welfareCost(law, econ){
  const u = (econ && econ.unemployment) || U_STAR;
  /* Ratchets: the triple lock raises the pension floor by the highest of
     several measures every year, so its cost compounds and never unwinds.
     `escalate` was declared on the policy and never read, which meant the
     signature feature of the most expensive commitment in the book did nothing
     at all. It is now a stock that grows for as long as the lock is in force. */
  const ratchet = (econ && econ.welfareRatchet) || 0;
  return law.spend.welfare + ratchet + CYCLICAL_WELFARE * (u - U_STAR);
}
/* ---- Service level per department ----
   A budget is an input; what matters is what it buys. Volume is real spending
   divided by the unit cost of delivery, need is the population it has to cover,
   and the score is the ratio, indexed so the opening settings score 55.

   This is why a share of GDP is a poor control on its own: hold it constant and
   the score still falls, because the unit cost of delivery rises faster than the
   money does. The Budget panel therefore shows both, and offers to hold the
   score steady and let the cost follow, which is the honest way round. */
function deptUnitCost(econ){
  return ((econ && econ.realWage) || 1) / ((econ && econ.pubProd) || 1);
}
function deptNeed(id, econ){
  const pop = ((econ && econ.L) || 100) / 100;
  const dep = (econ && econ.dependency) || DEP_0;
  const ageing = id === "health" ? 1 + AGEING_HEALTH*(dep - DEP_0) : 1;
  return pop * ageing;
}
function serviceScore(id, law, econ){
  const d = DEPTS.find(x => x.id === id);
  if(!d || TRANSFER_DEPTS[id]) return null;
  const gdp = (econ && econ.gdp) || 100;
  const volume = (law.spend[id]/100 * gdp) / deptUnitCost(econ);
  return clamp(55 * (volume / deptNeed(id, econ)) / (d.def/100 * 100), 0, 100);
}
/* The budget that would hold a given score: cost follows the standard, rather
   than the standard following whatever the budget happens to buy. */
function spendForScore(id, score, econ){
  const d = DEPTS.find(x => x.id === id);
  const gdp = (econ && econ.gdp) || 100;
  const volume = (score/55) * (d.def/100 * 100) * deptNeed(id, econ);
  return clamp(volume * deptUnitCost(econ) / gdp * 100, d.min, d.max);
}

/* What a claimant actually receives: the bill divided by the caseload. */
function welfareAdequacy(law, econ){
  const u = (econ && econ.unemployment) || U_STAR;
  const caseload = 1 + (u - U_STAR) * 0.055;
  return (law.spend.welfare / 13.3) / caseload;
}

function spending(law, E, econ){
  let prog = 0;
  for(const d of DEPTS) prog += (d.id === "welfare" ? welfareCost(law, econ) : law.spend[d.id]);
  prog += OTHER_SPEND + E.spend;
  const il = IL_REAL_COUPON + Math.max(-2, (econ.inflation !== undefined ? econ.inflation : 2));
  const blended = (1 - INDEX_LINKED) * econ.effInterest + INDEX_LINKED * il;
  const interest = econ.debt * blended / 100;
  return { prog, interest, total: prog + interest };
}

function balanceOf(law, econ){
  const E = aggregate(law);
  const rev = revenue(law, E, econ), sp = spending(law, E, econ);
  return { E, rev, sp, balance: rev.total - sp.total };
}

/* ---- Potential output from a production function ----
     Y* = A * K^alpha * (L*h)^(1-alpha)
   so trend growth is growth accounting rather than an assumed number:
     g(Y*) = g(A) + alpha*g(K) + (1-alpha)*(g(L) + g(h))

   A is total factor productivity, which trend growth in the UK has been weak
   enough to make the binding constraint; K comes from the investment block, so
   a decade of weak investment now shows up in supply; L is the labour force net
   of structural unemployment, which is where migration policy and the tax wedge
   enter; h is human capital from education spending, with Mincerian returns. */
/* Participation responds to the net-of-tax wage. The elasticity is deliberately
   modest: prime-age men barely move, while second earners and those near
   retirement move a good deal, and 0.15 is roughly the aggregate of that. This
   is a margin the model previously did not have at all, so income tax could
   only affect employment through the wage-bargaining wedge. */
const PART_ELAST = 0.15, PART_ADJ = 0.09;
const HYSTERESIS = 0.22;     // how far potential follows a sustained output gap
const TFP_TREND = 0.72;      // annual TFP growth, %. The UK's has been about this
const LABOUR_TREND = 0.35;   // annual labour force growth, %
const MINCER = 0.06;         // return to a point of GDP of extra education spend
const A0 = 100 / (Math.pow(K0, ALPHA) * Math.pow(KG0, ALPHA_G) * Math.pow(100, 1 - ALPHA - ALPHA_G));

function humanCapital(law){
  return 1 + MINCER * (law.spend.education - 4.1);
}
/* Effective labour input: the labour force less structural unemployment, times
   human capital. Migration policy moves the force itself. */
function labourInput(law, E, econ){
  const uStar = (econ && econ.nairu) || U_STAR;
  const part = (econ && econ.participation) || 1;
  const force = ((econ && econ.L) || 100) * (1 + (E.labour || 0)/100) * part;
  return force * (1 - uStar/100) / (1 - U_STAR/100) * humanCapital(law);
}
function potentialLevel(law, E, econ){
  const K = (econ && econ.K) || K0;
  const KG = (econ && econ.KG) || KG0;
  const A = (econ && econ.A) || A0;
  return A * Math.pow(Math.max(1, K), ALPHA)
           * Math.pow(Math.max(1, KG), ALPHA_G)
           * Math.pow(Math.max(1, labourInput(law, E, econ)), 1 - ALPHA - ALPHA_G);
}
/* Annualised trend growth, reported for display and used by the investment
   block. Derived from the production function rather than asserted. */
function potentialGrowth(law, E, econ){
  const e = econ || (typeof G !== "undefined" && G ? G.econ : null);
  if(!e || !e.K) return 1.2;
  const now = potentialLevel(law, E, e);
  const gA = TFP_TREND + (E.pot || 0) + (E.tfp || 0) + (e.tradeDepth || 0)*TRADE_TFP
           + (clamp(50 + (E.open||0), 5, 95) - 50)*0.006
           ;
  const gK = ((e.I - DEPREC/100*e.K) / e.K) * 100;
  const gKG = ((law.spend.infra/100*e.gdp - DEPREC_G/100*e.KG) / e.KG) * 100;
  const gL = LABOUR_TREND;
  return clamp(gA + ALPHA*gK + ALPHA_G*gKG + (1 - ALPHA - ALPHA_G)*gL, -2.5, 6);
}

function approvalOf(fac){
  return FACTIONS.reduce((a,f)=>a + fac[f.id]*f.w, 0);
}

/* ==================================================================
   THE EXPENDITURE SIDE
   Output is the national accounts identity, Y = C + I + G + X - M,
   with each component given its own behavioural equation. Nothing here
   is a "multiplier weight": multipliers are emergent, falling out of the
   marginal propensity to consume, the tax take and import leakage in
   the usual way, 1 / (1 - c(1-t)(1-m)).
   ================================================================== */

/* Baseline shares of GDP, chosen to match a mid-sized open economy and to sum
   to 100: C 62 + I 18 + G 23 + X 30 - M 33. */
/* UK 2025-26 outturn, as shares of GDP. Household plus non-profit consumption
   about 61 (ONS put household spending alone at 59% in 2025), private and
   dwellings investment 17, government consumption and investment 22, exports 31
   and imports 31. They sum to 100 by construction. */
const SHARE_C = 61, SHARE_I = 17, SHARE_G = 22, SHARE_X = 31, SHARE_M = 31;

/* Which spending is government demand and which is a transfer to households.
   Transfers are not G: they are income, and they reach output only through the
   consumption function. Getting this wrong would double-count the welfare bill. */
const TRANSFER_DEPTS = { welfare:true };
const OTHER_G = 2.5, OTHER_TRANSFER = 5.9;   // splits OTHER_SPEND

/* Import content of each spending line. A pound of defence procurement leaks
   abroad far faster than a pound of nurses' pay, which is why the two do not
   share a multiplier even though both are government consumption. */
const IMPORT_CONTENT = { health:0.08, education:0.05, infra:0.18, defence:0.30,
                         justice:0.07, environment:0.12, welfare:0.10, other:0.12 };

/* Consumption. Partial adjustment toward a target set by disposable income,
   with an interest-rate term standing in for debt service and the cost of
   credit. MPC of 0.6 sits in the usual range for aggregate quarterly data. */
const MPC = 0.70, C_ADJ = 0.34, C_RATE = 0.25, HH_TAX_SHARE = 0.70;
/* Income tax plus NI on the extra earned, then VAT and duty on what is spent. */
const MARGINAL_LEAK = 0.44;
/* Pinned so that at the baseline (Y = potential = 100, receipts 37.6% of GDP,
   transfers 15.4% of GDP) the consumption function returns exactly SHARE_C. */
const C_AUTO = 6.23;
const R_REAL_NEUTRAL = R_NEUTRAL - PI_TARGET;

/* Investment: accelerator plus user cost of capital,
      uc = real rate + depreciation + corporate tax wedge
   which is where corporation tax and the policy rate actually bite. */


/* Trade. Price elasticities comfortably satisfy Marshall-Lerner, so a loss of
   competitiveness worsens the balance. */
const T_ADJ = 0.42, ELAST_X = 0.85, ELAST_M = 0.60;
/* Import content of the baseline spending programme, so only deviations count. */
const BASE_LEAK = 2.5*0.12 + 8.4*0.08 + 4.1*0.05 + 2.5*0.18 + 2.4*0.30 + 1.9*0.07 + 0.8*0.12;
const WORLD_GROWTH = 2.0, WORLD_INFL = 2.0, BASE_TARIFF = 3;

/* Trade policy is not unilateral. Raise a tariff and partners raise theirs, with
   a lag and roughly in proportion, which hits exports on top of the domestic
   price effect. Without this a tariff was purely a domestic tax and protection
   looked far cheaper than it is. Poor relations make retaliation worse; a
   ratified agreement restrains it. */
const RETAL_SHARE = 0.75, RETAL_ADJ = 0.16, RETAL_ELAST = 1.1;

/* ---- Trade agreements take years, and then keep giving ----
   A deal used to land as a one-off level shift: exports jumped within two
   quarters and then sat there forever. Neither half of that is right.

   Firms do not re-plan supply chains in a quarter, so market access phases in
   over roughly five years (Baier and Bergstrand find bilateral trade keeps
   rising for a decade after an agreement). And the larger gains are dynamic
   rather than static: exposure to competition, specialisation and the
   technology that comes with trade raise productivity for as long as the
   openness lasts. `tradeDepth` carries the phase-in; `TRADE_TFP` carries the
   dynamic gain, which compounds through total factor productivity instead of
   sitting as a fixed addition to exports. */
const DEAL_PHASE = 0.055, TRADE_TFP = 0.020;

/* ---- Exchange rate: uncovered interest parity ----
   A higher domestic policy rate attracts capital and appreciates the currency
   immediately, leaving expected depreciation to offset the yield advantage. A
   risk premium pushes the other way, which is why a fiscal scare weakens the
   currency even as it raises rates. Trade volumes then respond to the real
   exchange rate with a lag, which is what produces a J-curve: the balance
   worsens on impact before volumes catch up. */
const WORLD_RATE = 2.6;      // world short rate, %
/* A point of interest differential sustained over several years is worth a few
   per cent on the currency, which is the usual empirical range. */
const FX_UIP = 0.030;        // fractional appreciation per point of differential
const FX_RISK = 0.055;       // fractional depreciation per point of risk premium
const FX_ADJ = 0.38;         // markets move fast, but not instantly

/* ---- Demography ----
   The old-age dependency ratio drives pension caseload, health demand and the
   growth of the labour force. UK is near 0.30 and heading for about 0.37. */
/* Demography is held static: the dependency ratio sits where it starts. The
   cohort model that would make it move properly is not worth its complexity
   here, and a drifting ratio nobody can influence is just a tax on the clock. */
const DEP_0 = 0.30, DEP_DRIFT = 0;
const AGEING_HEALTH = 3.4;   // elasticity of health demand to the dependency ratio
const AGEING_PENSION = 1.0;  // pension caseload is proportional to it

/* ---- Baumol's cost disease ----
   Public services are labour-intensive and their measured productivity barely
   moves, while their wage bill has to track the wider economy. A pound of
   health spending therefore buys less volume every year. This is why services
   decay at a constant share of GDP: not because of an assumed drift, but
   because unit costs rise faster than the money does. */
const PUB_PROD_GROWTH = 0.0;   // annual public sector productivity growth, %
const SVC_ADJ = 0.16;           // capacity takes time to build or lose

function govDemandShares(law, econ){
  let g = OTHER_G, tr = OTHER_TRANSFER;
  let leak = OTHER_G * IMPORT_CONTENT.other;
  for(const d of DEPTS){
    const amount = d.id === "welfare" ? welfareCost(law, econ) : law.spend[d.id];
    if(TRANSFER_DEPTS[d.id]) tr += amount;
    else { g += amount; leak += amount * (IMPORT_CONTENT[d.id] || 0.1); }
  }
  return { g, tr, leak };
}

/* One quarter of the expenditure side. Every component is a level indexed so
   that the baseline economy is 100, and each adjusts partially, which is what
   produces a multiplier that builds over a few quarters instead of landing
   all at once. */
function expenditureStep(e, law, E, revShare, modSpend){
  const pot = e.potential;
  const { g, tr, leak } = govDemandShares(law, e);

  // --- G: plans are set against trend output, not against this quarter's
  // outturn, which is both realistic and what keeps the system from feeding
  // back on itself within a quarter.
  const G = (g + (modSpend || 0)) / 100 * pot;
  const TR = tr / 100 * pot;

  // --- C: autonomous consumption plus the marginal propensity to consume out
  // of disposable income, less an interest-rate term for debt service and the
  // cost of credit. C_AUTO is pinned so the baseline economy reproduces its
  // consumption share exactly.
  /* Households pay the average rate on baseline income but the marginal rate on
     anything above it: income tax and NI on the extra earnings, then VAT and
     duties on what is spent. That wedge is the automatic stabiliser, and it is
     also most of what keeps the multiplier finite. Using the average rate here
     overstated multipliers by roughly a third. */
  const hhTax = revShare / 100 * pot * HH_TAX_SHARE
              + MARGINAL_LEAK * (e.gdp - pot);
  const yd = e.gdp - hhTax + TR;
  /* The rate that matters for a spending or investment decision is ex ante:
     nominal less *expected* inflation. Using realised headline inflation here
     meant a VAT rise, which spikes the price level for one quarter, registered
     as a large fall in real rates and stimulated consumption. Households
     putting up with a VAT rise are not being stimulated by it. */
  const realRate = e.rate - e.expect;
  /* Split disposable income between the two household types. A more equal
     distribution puts more of it in the hands of those who spend it. */
  /* How much of disposable income sits with households that spend it. Two
     things move it: the overall distribution, and the incidence of the tax
     system itself, taken from the same income distribution the tax code is
     integrated over. A cut aimed at the bottom raises it; one aimed at the top
     lowers it, and demand follows. */
  const equality = 1 + REDIST_SENS * (35 - (e.gini || 35)) / 35;
  const incidence = 1 + MPC_INCIDENCE * (incomeProfile(law, e).distMPC / MPC_DIST_BASE - 1);
  /* More households are constrained when the economy is weak, which is why the
     same budget buys more output in a slump than in a boom. */
  const slack = clamp(-(e.gdp/pot - 1)*100, -4, 4);
  const stateDep = 1 + SLACK_MPC * slack;
  const rtShare = clamp(RULE_OF_THUMB * equality * incidence * stateDep * (1 + (E.mpcw||0)/100), 0.15, 0.78);
  const market = e.gdp - hhTax;
  const ydRT = market * RT_MARKET_SHARE * (rtShare/RULE_OF_THUMB)
             + TR * RT_TRANSFER_SHARE * (rtShare/RULE_OF_THUMB);
  const ydPerm = yd - ydRT;

  /* Permanent income is a slow-moving average of the unconstrained households'
     disposable income, which is what gives consumption smoothing. */
  e.permInc += (ydPerm - e.permInc) * PERM_ADJ;

  const target = C_AUTO / 100 * pot
               + MPC_RT * ydRT
               + MPC_PERM * e.permInc
               - C_RATE * (realRate - R_REAL_NEUTRAL) / 100 * pot;
  e.C += (target - e.C) * C_ADJ;
  e.rtShare = rtShare;

  // --- I: desired capital stock from the production function's FOC
  const corpRate = (law.taxes.corpTax && law.taxes.corpTax.on) ? law.taxes.corpTax.rate : 0;
  const userCost = Math.max(1.2, realRate + DEPREC + corpRate * CORP_WEDGE + (E.ucost||0) + (e.modUcost||0));
  e.ucSmooth += (userCost - e.ucSmooth) * UC_SMOOTH;
  const gapPct = (e.gdp / pot - 1) * 100;
  const Kstar = KSTAR_SCALE * ALPHA * e.gdp / (Math.max(1.2, e.ucSmooth) / 100);
  const trendG = e.trendGrowth || 1.2;
  const Istar = (DEPREC + trendG) / 100 * e.K
              + K_ADJ * (Kstar - e.K)
              + I_ACCEL / 100 * gapPct * pot
              + (E.kboost||0) / 100 * pot;
  e.I += (Istar - e.I) * 0.30;
  e.Kstar = Kstar;
  e.userCost = userCost;
  // net capital accumulation, quarterly
  e.K += (e.I - DEPREC / 100 * e.K) / 4;
  e.KG += (law.spend.infra/100 * e.gdp - DEPREC_G / 100 * e.KG) / 4;

  // --- X and M
  /* Retaliation builds toward a share of whatever tariff wall you put up, less
     whatever your treaties hold back. */
  const provoke = Math.max(0, law.tariff - BASE_TARIFF - (E.tariffCut||0));
  const restraint = 1 - clamp((E.access||0)/22, 0, 0.65);
  e.retaliation += (provoke * RETAL_SHARE * restraint - e.retaliation) * RETAL_ADJ;

  e.worldY *= 1 + (WORLD_GROWTH + (e.worldShock || 0)) / 400;
  e.worldP *= 1 + WORLD_INFL / 400;
  /* Competitiveness runs on underlying prices, not headline. VAT is
     border-adjusted: exports leave zero-rated and imports pay it, so a VAT rise
     is not a loss of competitiveness. Feeding headline inflation in here made
     every VAT change look like a real appreciation, which it is not. */
  e.priceP *= 1 + (e.inflation - e.vatEcho*0.9) / 400;
  /* Uncovered interest parity, with a risk premium. */
  const fxTarget = 1 + FX_UIP * (e.rate - WORLD_RATE) - FX_RISK * e.riskPremium;
  e.fx += (fxTarget - e.fx) * FX_ADJ;

  /* Competitiveness is indexed to the opening settings, so a fresh game starts
     in equilibrium rather than in a trade-induced recession. A stronger currency
     makes exports dearer and imports cheaper. */
  const comp = (e.worldP / e.priceP) * (1 + E.open / 200)
             * (1 + BASE_TARIFF / 100) / (1 + Math.max(0, law.tariff - (E.tariffCut||0)) / 100)
             / Math.max(0.5, e.fx);
  let Xstar = SHARE_X / 100 * e.worldY * Math.pow(comp, ELAST_X);
  const domestic = e.C + e.I + G;
  /* Imports pulled in by domestic demand, plus the direct import content of the
     government's own purchases. */
  const Mstar = (SHARE_M / (SHARE_C + SHARE_I + SHARE_G)) * domestic * Math.pow(comp, -ELAST_M)
              + (leak - BASE_LEAK) / 100 * pot;
  /* Exports also grow with the country's own supply capacity, not just world
     demand: a bigger, more productive economy sells more abroad. Without this
     the trade balance drifted structurally as trend growth diverged from the
     world's. */
  const Xcap = Math.pow(pot / e.worldY, 0.85);
  e.tradeDepth += ((E.access||0) - e.tradeDepth) * DEAL_PHASE;
  Xstar *= Xcap * (1 + e.tradeDepth/100) * Math.max(0.35, 1 - e.retaliation*RETAL_ELAST/100);
  e.X += (Xstar - e.X) * T_ADJ;
  e.M += (Mstar - e.M) * T_ADJ;

  return { C:e.C, I:e.I, G, TR, X:e.X, M:e.M, Y: e.C + e.I + G + e.X - e.M, comp, userCost, yd };
}

/* ==================================================================
   4. THE ENGINE
   ================================================================== */

function step(g, law, prevLaw, det){
  const e = g.econ;
  const E = aggregate(law), Ep = aggregate(prevLaw);
  const prof = incomeProfile(law, e);
  const pg = potentialGrowth(law, E, e);

  /* Modifiers may act on an outcome (`growth`, `inflation`) or, better, on a
     channel: world demand, the cost of capital, labour supply, the terms of
     trade. An event that says "a recession abroad" should reduce world demand
     and let the trade block work out what that does to exports, rather than
     asserting a number for domestic growth. */
  let mG=0, mI=0, mS=0, mA=0, mP=0, mW=0, mUC=0, mPart=0, mLab=0, mToT=0;
  g.mods = g.mods.filter(m => m.q > 0);
  g.mods.forEach(m => { mG+=m.growth||0; mI+=m.inflation||0; mS+=m.spend||0;
                        mA+=m.approval||0; mP+=m.potential||0;
                        mW+=m.world||0; mUC+=m.ucost||0; mPart+=m.part||0;
                        mLab+=m.labour||0; mToT+=m.tot||0; m.q--; });
  e.worldShock = mW;
  e.modUcost = mUC;
  e.modToT = mToT;

  // fiscal impulse from whatever the bill changed
  /* The old fiscal-impulse term lived here. It is gone: G enters the identity
     directly and taxes enter through disposable income, so the multiplier is
     produced by the model rather than asserted by a coefficient. */

  /* ---- Output is the national accounts identity ----
       Y = C + I + G + X - M
     Each component has its own equation in the expenditure block above. The
     fiscal multiplier is not set anywhere: it emerges from the marginal
     propensity to consume, the tax take out of income and import leakage,
     which is where multipliers come from in the first place. */
  const revShare = revenue(law, E, e).total;
  const prevY = e.gdp;
  const acct = expenditureStep(e, law, E, revShare, mS);

  /* Two channels that sit outside the identity: the policy rate works through
     C and I above, but an elevated gilt yield is a credit-spread shock that
     hits borrowers directly, and events can shift demand exogenously. */
  const yieldShock = -Math.pow(Math.max(0, e.yield - 6.0), 1.3) * 0.45;
  const noise = det ? 0 : (Math.random()-0.5)*0.7;
  /* Shocks that sit outside the component equations are attributed to private
     demand rather than added to output directly. Adding them to Y left the
     sectoral balances failing to close by whatever the shock happened to be. */
  const exog = (yieldShock + E.gro + mG + noise) / 400 * prevY;
  e.C += exog;
  acct.C = e.C;
  acct.Y = e.C + acct.I + acct.G + acct.X - acct.M;

  e.gdp = Math.max(5, acct.Y);
  let growth = clamp((e.gdp/prevY - 1) * 400, -18, 18);
  e.gdp = prevY * (1 + growth/400);
  if(acct.Y > 0){ const kY = e.gdp/acct.Y; e.C *= kY; acct.C = e.C; acct.Y = e.gdp; }
  e.acct = acct;

  /* Potential is the production function evaluated on the current stocks, not a
     compounding growth rate. TFP is the only piece that trends on its own. */
  /* Hysteresis. A sustained gap does not simply close on its own: a boom pulls
     in capacity and a slump scars it, and potential follows demand part of the
     way. Without this the baseline ran persistently hot, because nothing tied
     supply to the demand it was failing to meet. */
  const hyst = HYSTERESIS * clamp((e.gdp/e.potential - 1)*100, -4, 4);
  e.A *= 1 + (TFP_TREND + (E.pot||0) + (E.tfp||0) + (e.tradeDepth||0)*TRADE_TFP
              + (clamp(50 + (E.open||0),5,95) - 50)*0.006
              + hyst + mP) / 400;
  /* The labour force grows more slowly as the population ages, before any
     migration policy. */
  const ageingDrag = (e.dependency - DEP_0) * 55;
  e.L *= 1 + (LABOUR_TREND - ageingDrag + (E.labour||0) + mLab) / 400;

  /* Participation margin: people enter and leave the workforce as the reward
     for working changes. */
  const netWage = (1 - prof.meanMtr) / (1 - MTR_BASE);
  const partTarget = (1 + PART_ELAST * (netWage - 1)) * (1 + ((E.part||0) + mPart)/100);
  e.participation += (partTarget - e.participation) * PART_ADJ;
  e.potential = potentialLevel(law, E, e);   // uses last quarter's u*, set below
  e.trendGrowth = pg;

  /* ---- Expectations-augmented Phillips curve ----
       pi_t = lambda*pi_{t-1} + (1-lambda)*pi^e + kappa*gap + shocks
     Expectations are partly anchored on the target and partly backward-looking,
     which is what lets inflation de-anchor if it is allowed to run. */
  const newGap = (e.gdp/e.potential - 1)*100;
  /* Pass-through of a VAT change into the price level. Not one-for-one: only
     part of the basket is standard-rated and only part of the change reaches
     shelf prices. */
  const dVat = (law.taxes.vat.rate - prevLaw.taxes.vat.rate) * 0.38;
  e.vatEcho = e.vatEcho*0.6 + dVat;
  /* Credibility earned or lost, and it sets how strongly expectations are
     anchored to the target rather than to recent experience. */
  const miss = Math.abs(e.inflation - PI_TARGET);
  e.credibility = clamp(e.credibility + (miss < 1 ? CRED_GAIN*(1 - e.credibility)
                                                  : -CRED_LOSS*Math.min(3, miss - 1)), 0.05, 0.97);
  const anchor = 0.10 + 0.55 * e.credibility;
  e.expect += ((1 - anchor)*e.inflation + anchor*PI_TARGET - e.expect)*PI_ADJ;
  const shockNow = e.supplyShock * (1 - clamp(E.resilience,0,0.8));
  const dEr = ((law.ni.erOn===false?0:law.ni.erRate) - (prevLaw.ni.erOn===false?0:prevLaw.ni.erRate)) * 0.06;
  /* Inertia carries *underlying* inflation forward, not the indirect-tax echo. A
     VAT change is a one-off shift in the price level: it shows up in the annual
     rate for four quarters and then drops out. Feeding it through the persistence
     term made a single VAT rise look like a permanent inflation problem, which
     the Bank then tightened into for years. */
  /* Wage bargaining, then unit labour costs, then prices. */
  const slack = e.nairu - e.unemployment;
  const prodGrowth = Math.max(-1, e.trendGrowth - LABOUR_TREND);
  const wageGrowth = e.expect + prodGrowth + WAGE_CURVE * slack;
  e.wageGrowth = wageGrowth;
  const ulc = wageGrowth - prodGrowth;
  const importInf = (WORLD_INFL - (e.fx - 1)*100*0.6) + (e.modToT||0);
  e.ulc = ulc;

  const inertia = e.inflation - e.vatEcho*0.6;
  e.inflation = clamp(PI_LAMBDA*inertia
                      + (1-PI_LAMBDA)*(ULC_PASS*ulc + IMPORT_PASS*importInf
                                       + (1 - ULC_PASS - IMPORT_PASS)*e.expect)
                      + PI_KAPPA*(1 + PI_CONVEX*Math.max(0, newGap))*newGap
                      + shockNow + e.vatEcho + E.inf + mI + dEr, -4, 45);
  e.supplyShock *= 0.55;

  /* ---- Taylor rule ----
       i = r* + pi + a_pi*(pi - pi*) + a_y*gap
     with partial adjustment, because policy rates move in steps.
     Manual mode (sandbox-style toggle) pins the rate and skips the rule. */
  if(g.rateManual){
    e.rate = clamp(g.manualRate != null ? g.manualRate : e.rate, MANUAL_RATE_MIN, 20);
  } else {
    /* Central banks look through the first-round effect of an indirect tax change
       rather than tightening into it, so the rule sees inflation net of most of
       the VAT echo. Without this, a VAT rise hit demand twice: once directly and
       once through a rate rise it should never have caused. */
    const underlying = e.inflation - e.vatEcho*0.75;
    const target = R_NEUTRAL_REAL + underlying + TAYLOR_PI*(underlying - PI_TARGET) + TAYLOR_Y*newGap;
    e.rate = clamp(e.rate + (clamp(target, RATE_FLOOR, 20) - e.rate)*TAYLOR_SMOOTH, RATE_FLOOR, 20);
  }
  e.atBound = e.rate <= RATE_FLOOR + 0.02;

  /* ---- Okun's law around a wage-setting equilibrium ----
       du = -beta*(g - g*) + adjustment toward u*
     u* itself comes from the wage-setting block below. */
  const erGap = (law.ni.erOn === false ? 0 : law.ni.erRate) - DEF_NI.erRate;
  /* Track how much of the employer NI deviation has not yet passed into wages.
     A rate change lands unshifted and decays toward the wage bill from there. */
  e.erBorne += (erGap - e.erBornePrev);
  e.erBornePrev = erGap;
  e.erBorne *= (1 - WAGE_SHIFT);
  const shifted = erGap - e.erBorne;

  const wedgePP = (prof.meanMtr - MTR_BASE)*100 + shifted;
  const nairu = U_STAR
              + WEDGE_ELAST * wedgePP
              + LABOUR_COST_ELAST * e.erBorne
              + REPLACEMENT_ELAST * (law.spend.welfare - 13.3 + (E.replace||0))
              - SKILLS_ELAST * (law.spend.education - 4.1)
              + E.nairu;
  e.nairu = nairu;
  e.unemployment = clamp(e.unemployment - OKUN_BETA*(growth - pg)/2
                         + (nairu - e.unemployment)*U_ADJ, 1.6, 25);

  /* ---- Debt dynamics ----
       db = (r - g)/(1 + g) * b - primary balance
     the standard accumulation identity, plus a convex risk premium in the
     yield: markets ignore the debt level until they abruptly do not. */
  const rev = revenue(law, E, e), sp = spending(law, E, e);
  /* ---- Growth is not fiscally neutral ----
     Spending is a plan in real terms, set against trend output, so its share of
     GDP falls when the economy runs ahead of trend and rises in a slump. And
     receipts are more than unit-elastic to output: profits, capital gains and
     transaction taxes are all strongly cyclical, so the receipts ratio itself
     improves in a boom.

     Before this the books were pure ratios on both sides, which made growth
     fiscally neutral except through the debt dynamics. Growing your way out of
     a deficit was impossible, which is not how public finances work. */
  const gapNow = (e.gdp/e.potential - 1);
  const pot = e.potential;
  const spendRatio = pot / e.gdp;                    // real plans, nominal denominator
  const revCyc = 1 + REV_GAP_ELAST * gapNow;
  const progShare = (sp.prog + mS) * spendRatio;
  const revShareEff = rev.total * revCyc;
  e.revShareEff = revShareEff;
  e.progShare = progShare;

  const primaryDeficit = progShare - revShareEff;
  const nominalGrowth = growth + e.inflation;
  /* Debt may go negative. Sustained surpluses turn the liability into a stock of
     public assets, and from there the interest line becomes income rather than
     cost: a sovereign wealth fund, arrived at by running the books properly
     rather than by buying one. The floor used to be 3% of GDP, so paying the
     debt off simply stopped working. */
  /* The indexed portion of the stock cannot be inflated away: its cost rises
     with prices, so only the conventional share is eroded by nominal growth.
     Inflating your way out of the debt works, but on three quarters of it. */
  const ilCost = IL_REAL_COUPON + Math.max(-2, e.inflation);
  const blended = (1 - INDEX_LINKED) * e.effInterest + INDEX_LINKED * ilCost;
  e.blendedRate = blended;
  e.debt = clamp(e.debt*(1 + (blended - nominalGrowth)/400) + primaryDeficit/4 - e.fund*0.02,
                 -200, 400);
  const deficit = -(revShareEff - progShare - sp.interest);

  /* ---- Sectoral balances ----
     One sector's deficit is another's surplus, so the three must sum to zero:

         (S - I)private  +  (T - G)government  +  (M - X)foreign  =  0

     This is the Godley identity, and it was not holding: each block was
     individually sensible but nothing forced them to add up, so the model could
     produce combinations that cannot exist. Private disposable income is now
     defined properly as output less net taxes plus the debt interest the state
     pays out, which is what closes it.

     The residual is carried explicitly rather than hidden, so a drift shows up
     instead of quietly distorting the accounts. */
  const trShare = govDemandShares(law, e).tr;
  const netTaxes = revShareEff - trShare;
  const privateDispY = 100 - netTaxes + sp.interest;      // as % of GDP
  const consumeShare = acct.C / e.gdp * 100;
  const investShare = acct.I / e.gdp * 100;
  e.balPrivate = privateDispY - consumeShare - investShare;
  e.balGovt = -deficit;
  e.balForeign = (acct.M - acct.X) / e.gdp * 100;
  e.balResidual = e.balPrivate + e.balGovt + e.balForeign;

  /* Net private financial wealth accumulates the private balance, which gives
     the model a stock to hang a credit cycle on later. */
  e.privateWealth += e.balPrivate / 4;
  /* A creditor state pays no risk premium; it earns a return roughly in line
     with world rates on what it holds. */
  if(e.debt < 0){
    e.yield = clamp(e.rate + 0.3, 0.2, 25);
    e.effInterest += (e.yield - e.effInterest)*MATURITY_PASS;
    e.riskPremium = 0;
  } else
  e.yield = clamp(e.rate + 0.3
              + Math.pow(Math.max(0, e.debt - 80), 1.35)*0.012
              + Math.pow(Math.max(0, deficit - 3), 1.40)*0.20
              + e.riskPremium
              - (law.policies.fiscalRule ? 0.5 : 0), 0.2, 25);
  e.riskPremium *= 0.7;
  e.effInterest += (e.yield - e.effInterest)*MATURITY_PASS;
  if(law.policies.swf && deficit < 2) e.fund += 0.25;

  // wages, thresholds and fiscal drag
  e.wageIndex *= 1 + Math.max(-0.02, (growth + e.inflation)/400);
  if(law.income.uprate){
    const up = 1 + Math.max(0, e.inflation)/400;
    law.income.allowance *= up;
    law.income.bands.forEach(b=> b.from *= up);
  }

  // society
  /* ---- Public services: volume against need, not an assumed decay ----
     The old model simply added a constant to required spending every quarter,
     so services degraded because they were told to. They now degrade for the
     two reasons they actually do.

     Baumol: a unit of public service costs the public sector wage bill divided
     by public sector productivity. Wages track economy-wide productivity, which
     grows several times faster than measured productivity in health and
     education, so a pound buys less volume every year.

       unit cost   = real wage / public productivity
       volume      = real spending / unit cost
       need        = population * demand per head(dependency ratio)
       quality     = volume / need

     A constant share of GDP therefore delivers falling quality without anyone
     deciding it should, and the size of the effect is derived from the
     productivity gap and the demography rather than picked. */
  /* ---- Tax base indices ----
     Each is 1 at the opening settings, so a tax with `basis` set is scaled by
     how its own base has moved rather than by output. */
  const gapPct = (e.gdp/e.potential - 1);
  e.baseConsumption = e.C / SHARE_C;
  e.baseWages = (e.gdp/100) * ((e.realWage||1)/(e.pubProd||1) > 0 ? 1 : 1)
              * ((e.participation||1)) * (1 - (e.unemployment - U_STAR)/100*1.4);
  e.profitShare = Math.max(0.15, 1 + PROFIT_CYC * gapPct);
  /* Profits booked here rather than abroad. A rate above the world average
     drives the base out; a rate below it pulls the base in, which is the whole
     logic of tax competition and the main reason corporation tax raises less
     than a static costing suggests. */
  const cRate = (law.taxes.corpTax && law.taxes.corpTax.on) ? law.taxes.corpTax.rate : 0;
  e.profitShift = clamp(1 - SHIFT_ELAST * (cRate - WORLD_CORP), 0.45, 1.35);
  e.baseProfitsRaw = (e.gdp/100) * e.profitShare * e.profitShift;
  e.baseProfits = e.baseProfits + (e.baseProfitsRaw - e.baseProfits) * CORP_LAG;

  const realRateNow = e.rate - e.expect;
  const assetTarget = Math.max(0.25, 1 / (1 + (realRateNow - R_REAL_NEUTRAL)/ASSET_RATE))
                    * (1 + gapPct*0.8);
  e.assetPrice += (assetTarget - e.assetPrice) * ASSET_ADJ;
  e.baseAssetsRaw = (e.gdp/100) * e.assetPrice;
  e.baseAssets = e.baseAssets + (e.baseAssetsRaw - e.baseAssets) * CGT_LAG;

  e.fuelVolume *= 1 - (FUEL_EROSION + CARBON_EROSION * (law.taxes.carbon.on ? law.taxes.carbon.rate : 0)) / 400;

  stepNations(e, det);

  /* Regional divergence, driven by what each place is exposed to. */
  const tradeG = ((acct.X - (e.prevX || acct.X)) / Math.max(1, acct.X)) * 400;
  const publicG = (govDemandShares(law, e).g - (e.prevG || govDemandShares(law, e).g)) * 4;
  stepRegions(e, law, growth, clamp(tradeG, -12, 12), clamp(publicG, -6, 6),
              (e.ucSmooth || UC_BASE) - UC_BASE);
  e.prevX = acct.X; e.prevG = govDemandShares(law, e).g;

  e.dependency += DEP_DRIFT;
  e.pubProd *= 1 + PUB_PROD_GROWTH/400;
  e.realWage *= 1 + Math.max(-0.5, pg)/400;          // wages track trend productivity
  const unitCost = e.realWage / e.pubProd;

  const hSpend = law.spend.health + law.spend.education*0.55;
  const volume = (hSpend/100 * e.gdp) / unitCost;
  const need = (e.L/100) * (1 + AGEING_HEALTH*(e.dependency - DEP_0));
  const quality = volume / need;
  const QUALITY_0 = ((8.4 + 4.1*0.55)/100 * 100);    // baseline volume per unit of need
  const sTarget = clamp(55 * quality / QUALITY_0
                        - Math.max(0, e.inflation - 2)*1.2 + E.srv + E.hlt*2, 0, 100);
  e.services = clamp(e.services + (sTarget - e.services)*SVC_ADJ, 0, 100);
  e.svcQuality = quality / QUALITY_0;
  e.unitCost = unitCost;

  /* Pension caseload rises with the dependency ratio, so a fixed share of GDP
     buys steadily less generosity per pensioner. This is the demographic squeeze
     the triple lock argues about. */
  /* Accumulate any commitment that escalates by rule rather than by decision. */
  let escalation = 0;
  for(const id in law.policies){
    if(!law.policies[id]) continue;
    const pol = POLICY_BY_ID[id];
    if(pol && pol.escalate) escalation += pol.escalate;
  }
  e.welfareRatchet = Math.max(0, (e.welfareRatchet || 0) + escalation/4);

  e.pensionAdequacy = welfareAdequacy(law, e);

  /* Departments set to hold their service level have their budget uprated to
     whatever that standard now costs. The player sees the share of GDP climb,
     which is the point: standing still has a price and it should be visible. */
  /* Three ways to set a budget, and they diverge over time:
       share    the default, a fixed share of GDP, so it grows with the economy
       real     indexed to inflation, so the cash keeps its value but the share
                falls as the economy grows and services decay faster
       service  the standard is fixed and the cost follows it
     The middle option is what "keep spending in line with inflation" means, and
     it is worth seeing that it is not enough to stop services deteriorating:
     inflation-indexing covers price rises but not the real wage growth of the
     people who deliver the service, nor a growing population. */
  for(const d of DEPTS){
    const mode = (law.mode || {})[d.id];
    if(!mode || mode === "share") continue;
    if(mode === "service" && !TRANSFER_DEPTS[d.id]){
      const want = (law.hold || {})[d.id] || serviceScore(d.id, law, e);
      law.spend[d.id] = spendForScore(d.id, want, e);
    } else if(mode === "real"){
      // hold the cash constant in real terms: the share moves with real growth
      const realGrowth = Math.max(-8, growth);
      law.spend[d.id] = clamp(law.spend[d.id] * (1 - realGrowth/400), d.min, d.max);
    }
  }
  e.health   = clamp(e.health   + ((55 + E.hlt*6 + (e.services-55)*0.4) - e.health)*0.15, 0, 100);
  e.crime    = clamp(e.crime    + ((42 + E.cri*1.6 + E.blackLevel*0.35 - (law.spend.justice-1.9)*7
                                    + (e.unemployment-4.2)*2.2) - e.crime)*0.16, 0, 100);
  e.liberty  = clamp(e.liberty  + ((58 + E.lib) - e.liberty)*0.25, 0, 100);
  e.env      = clamp(e.env      + ((44 + E.env + (law.spend.environment-0.8)*6
                                    + law.taxes.carbon.rate*0.5) - e.env)*0.14, 0, 100);
  e.openness = clamp(50 + E.open, 5, 95);
  const gTarget = 35 + E.gini + (e.unemployment - 4.2)*0.5 - (prof.progressivity - PROG_BASE)*16;
  e.gini = clamp(e.gini + (gTarget - e.gini)*0.12, 14, 68);

  // relations drift and react
  for(const p of PARTNERS){
    let t = 50 + (law.tariff <= 3 ? 2 : -law.tariff*0.9) + E.trade*3;
    for(const id in law.deals) if(law.deals[id] && DEAL_BY_ID[id].partner === p.id) t += 9;
    const dt = law.taxes.digitalTax;
    if(p.id === "federated" && dt.on) t -= dt.rate*0.8;
    g.rel[p.id] = clamp(g.rel[p.id] + (t - g.rel[p.id])*0.15, 0, 100);
  }

  // the public
  const realIncome = growth - Math.max(0, e.inflation - 2)*0.85;
  const common = 40 + realIncome*2.6 - Math.max(0, e.inflation-3)*2.0
               - (e.unemployment-4.2)*2.6 + (e.services-55)*0.40;
  const extra = {
    business:  (pg - 1.5)*5,
    workers:  -(e.unemployment - 4.2)*2.0 - (e.gini - 35)*0.30,
    pensioners:-Math.max(0, e.inflation - 2)*2.2 + (e.services - 55)*0.25,
    urban:     (e.liberty - 58)*0.22 + (e.env - 44)*0.14,
    rural:    -(e.crime - 42)*0.14,
    patriots: -(e.openness - 50)*0.14 - (e.crime - 42)*0.20
  };
  const topRate = law.income.bands[law.income.bands.length-1].rate;
  extra.workers  -= (law.income.bands[0].rate - 20)*0.55;
  extra.business -= (topRate - 45)*0.22;
  extra.urban    += (prof.progressivity - PROG_BASE)*10;
  extra.rural    -= (law.income.bands[0].rate - 20)*0.30;
  const fiscalDrag = clamp(1 - dragRatio(law, e), -0.4, 0.6);
  extra.workers    -= fiscalDrag*16 + ((law.ni.empOn===false?0:law.ni.empRate) - DEF_NI.empRate)*0.9;
  extra.pensioners -= fiscalDrag*10;
  extra.pensioners += ((e.pensionAdequacy || 1) - 1) * 30;
  /* The empirical result on employer payroll taxes is that most of the burden
     lands on wages within a few years rather than on employment. So the bulk of
     it is felt by workers as pay that never arrives, a smaller part by
     employers, and only a little shows up as structural unemployment above. */
  extra.business   -= erGap*0.55;
  extra.workers    -= erGap*0.60;
  const shock = billShock(law, prevLaw);
  for(const f of FACTIONS){
    const t = common + E.fac[f.id] + (extra[f.id]||0);
    g.fac[f.id] = clamp(g.fac[f.id] + (t - g.fac[f.id])*0.20 + (shock[f.id]||0) + mA, 2, 96);
  }

  const appr = approvalOf(g.fac);
  g.capital = clamp(g.capital + 2.4 + (appr - 45)*0.09, 0, 100);
  if(law.policies.fiscalRule && deficit > 4){ g.ruleBreaches++; g.capital = clamp(g.capital - 3, 0, 100); }

  g.q++;
  g.log.push({
    label: qLabel(g, g.q-1), growth, inflation:e.inflation, unemployment:e.unemployment,
    balance:-deficit, debt:e.debt, yield:e.yield, approval:appr, rate:e.rate,
    gdp:e.gdp, potential:e.potential, services:e.services, gini:e.gini, capital:g.capital,
    C:acct.C, I:acct.I, Gov:acct.G, X:acct.X, M:acct.M, netTrade:acct.X - acct.M,
    K:e.K, tfp:e.A*1000, userCost:e.ucSmooth, trend:pg,
    drag:dragRatio(law, e), allowance:law.income.allowance,
    fac:Object.assign({}, g.fac), rev:rev.total, spend:sp.prog + mS, interest:sp.interest
  });
  return { growth, pg, deficit, gap:newGap, E, rev, sp };
}

/* one-off popularity jolt from what the bill actually did */
function billShock(law, prevLaw){
  const s = {business:0, workers:0, pensioners:0, urban:0, rural:0, patriots:0};
  for(const t of TAXES){
    const a = prevLaw.taxes[t.id], b = law.taxes[t.id];
    if(!a || !b) continue;
    const wasOn = a.on && taxAvailable(t, prevLaw), isOn = b.on && taxAvailable(t, law);
    let d = (isOn ? b.rate : 0) - (wasOn ? a.rate : 0);
    if(!d) continue;
    const weight = t.grp === "income" ? 0.55 : t.grp === "consumption" ? 0.40 : 0.25;
    for(const f in s) s[f] -= d * weight * 0.5;
    if(t.fac) for(const f in t.fac) if(f in s) s[f] += (t.fac[f] || 0) * d * 0.25;
  }
  const dBasic = law.income.bands[0].rate - prevLaw.income.bands[0].rate;
  const dAllow = (law.income.allowance - prevLaw.income.allowance)/1000;
  const dEmp = (law.ni.empOn===false?0:law.ni.empRate) - (prevLaw.ni.empOn===false?0:prevLaw.ni.empRate);
  const dEr  = (law.ni.erOn===false?0:law.ni.erRate) - (prevLaw.ni.erOn===false?0:prevLaw.ni.erRate);
  s.workers    += -dBasic*1.7 + dAllow*1.9 - dEmp*1.9;
  s.pensioners += -dBasic*1.1 + dAllow*1.3;
  s.urban      += -dBasic*1.2 + dAllow*1.2 - dEmp*0.9;
  s.rural      += -dBasic*1.2 + dAllow*1.2 - dEmp*0.9;
  s.business   += -dEr*2.4 - dBasic*0.3;
  const dTop = law.income.bands.length === prevLaw.income.bands.length
             ? law.income.bands[law.income.bands.length-1].rate - prevLaw.income.bands[prevLaw.income.bands.length-1].rate : 0;
  s.business   -= dTop*1.1;
  s.workers    += dTop*0.5;

  for(const dp of DEPTS){
    const d = law.spend[dp.id] - prevLaw.spend[dp.id];
    if(!d) continue;
    const pop = {health:1.5, education:0.9, welfare:1.2, infra:0.4, defence:0.3, justice:0.6, environment:0.3}[dp.id];
    for(const f in s) s[f] += d * pop * 0.55;
  }
  return s;
}

function qLabel(g, i){ return "Y" + (Math.floor(i/4) + 1 + (g.term-1)*5) + " Q" + (i%4 + 1); }

/* ==================================================================
   5. PROJECTION  (the independent forecast)
   ================================================================== */

/* Deterministic counterfactual: run `law` forward from today's state without
   touching the live game. Everything in the impact panel is derived from this,
   so the numbers shown can never drift away from the model that produces them.
   `opts` can override monetary mode so a pinned-rate path can be scored against
   the Bank without mutating live G. */
function simulate(law, quarters, opts){
  const o = opts || {};
  const rateManual = o.rateManual != null ? !!o.rateManual : !!G.rateManual;
  const manualRate = o.manualRate != null ? o.manualRate : G.manualRate;
  const sim = {
    q:G.q, term:G.term, mods:clone(G.mods), econ:clone(G.econ), fac:clone(G.fac),
    rel:clone(G.rel), capital:G.capital, log:[], ruleBreaches:0, sandbox:true,
    rateManual, manualRate
  };
  const rateLo = rateManual ? MANUAL_RATE_MIN : RATE_FLOOR;
  if(o.rate != null) sim.econ.rate = clamp(o.rate, rateLo, 20);
  else if(rateManual && manualRate != null) sim.econ.rate = clamp(manualRate, rateLo, 20);
  const draft = clone(law);
  const rows = [];
  let prev = clone(G.law);
  for(let i=0; i<quarters; i++){
    const r = step(sim, draft, prev, true);
    prev = draft;
    rows.push({
      label: qLabel(sim, sim.q-1),
      growth:r.growth, inflation:sim.econ.inflation, unemployment:sim.econ.unemployment,
      balance:-r.deficit, debt:sim.econ.debt, yield:sim.econ.yield,
      approval:approvalOf(sim.fac), services:sim.econ.services
    });
  }
  return { rows, end:sim };
}
function project(quarters){ return simulate(G.draft, quarters); }

/* ---- The forecast is not the outturn ----
   The projection used to run the true model, so it was always exactly right.
   Real Chancellors are handed forecasts that miss: the OBR's own one-year-ahead
   error is around 1% of GDP on borrowing and well over a point on growth. The
   numbers shown are therefore perturbed by a persistent error drawn once per
   forecast, which is what makes the decision a judgement rather than a lookup. */
const FC_GROWTH_SD = 0.75, FC_BAL_SD = 0.55, FC_INF_SD = 0.45;
function withForecastError(p){
  /* Sandbox is the mode for seeing how the model works, so the forecast is the
     model: no error, and the projection is exactly what will happen if nothing
     else does. Turn sandbox off and you get the Chancellor's actual problem,
     which is deciding on numbers that will turn out to be wrong. */
  if(G.sandbox) return { rows:p.rows, end:p.end, err:{ growth:0, balance:0 }, exact:true };
  const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) * 1.15;
  const eg = gauss()*FC_GROWTH_SD, eb = gauss()*FC_BAL_SD, ei = gauss()*FC_INF_SD;
  const rows = p.rows.map((r,i)=>{
    const ramp = (i+1)/p.rows.length;      // error widens with the horizon
    return Object.assign({}, r, {
      growth: r.growth + eg*ramp,
      balance: r.balance + eb*ramp,
      inflation: r.inflation + ei*ramp,
      unemployment: r.unemployment - eg*ramp*0.3,
      debt: r.debt - eb*ramp*0.9
    });
  });
  return { rows, end:p.end, err:{ growth:eg, balance:eb } };
}

/* The law you would have if only clause `i` of the current bill passed. Built by
   cloning the draft and undoing every other clause, so it uses exactly the same
   machinery the bill itself does rather than a parallel description of it. */
function lawWithOnlyClause(i){
  const saved = G.draft;
  G.draft = clone(G.draft);
  const cl = billClauses();
  cl.forEach((c,j)=>{ if(j !== i) c.undo(); });
  const only = clone(G.draft);
  G.draft = saved;
  return only;
}

const IMPACT_ROWS = [
  { k:"balance",      name:"Budget balance",  unit:"pts", dp:2, good:"up" },
  { k:"growth",       name:"Growth",          unit:"pts", dp:2, good:"up" },
  { k:"inflation",    name:"Inflation",       unit:"pts", dp:2, good:"down" },
  { k:"unemployment", name:"Unemployment",    unit:"pts", dp:2, good:"down" },
  { k:"debt",         name:"Debt",            unit:"pts", dp:2, good:"down" },
  { k:"yield",        name:"Gilt yield",      unit:"pts", dp:2, good:"down" },
  { k:"approval",     name:"Approval",        unit:"pts", dp:2, good:"up" },
  { k:"services",     name:"Public services", unit:"pts", dp:2, good:"up" }
];

/* Compound the path's quarterly growth rates into total % growth over the
   horizon. Each row's `growth` is already annualised (qoq × 400), so undo that
   before compounding. Over four quarters this is year-on-year GDP growth. */
function pathGrowth(rows){
  let y = 1;
  for(const r of rows) y *= 1 + r.growth / 400;
  return (y - 1) * 100;
}

/* Difference a law makes against a baseline, after `quarters` quarters.
   Most headline series are end-of-horizon levels. Growth is the cumulative
   rise in GDP over the whole path versus the baseline path — not the final
   quarter's annualised pace, which whipsaws after a level jump. */
function impactOf(law, baseline, quarters){
  const v = simulate(law, quarters);
  const a = baseline.rows[baseline.rows.length-1], b = v.rows[v.rows.length-1];
  const out = { head:{}, fac:{}, gini: v.end.econ.gini - baseline.end.econ.gini };
  IMPACT_ROWS.forEach(r=>{
    out.head[r.k] = r.k === "growth"
      ? pathGrowth(v.rows) - pathGrowth(baseline.rows)
      : b[r.k] - a[r.k];
  });
  FACTIONS.forEach(f=>{ out.fac[f.id] = v.end.fac[f.id] - baseline.end.fac[f.id]; });
  out.revenue = revenue(law, aggregate(law)).total
              - revenue(G.law, aggregate(G.law)).total;
  return out;
}

/* Pin the base rate versus leaving it with the Bank, same horizon as the bill
   impact panel. Uses current law so the strip isolates the monetary choice. */
function impactOfRatePin(quarters){
  const q = quarters || 4;
  const pin = clamp(G.manualRate != null ? G.manualRate : G.econ.rate, MANUAL_RATE_MIN, 20);
  const base = simulate(G.law, q, { rateManual:false });
  const v = simulate(G.law, q, { rateManual:true, manualRate:pin, rate:pin });
  const a = base.rows[base.rows.length-1], b = v.rows[v.rows.length-1];
  const out = { head:{}, fac:{}, gini: v.end.econ.gini - base.end.econ.gini, pin, revenue:0 };
  IMPACT_ROWS.forEach(r=>{
    out.head[r.k] = r.k === "growth"
      ? pathGrowth(v.rows) - pathGrowth(base.rows)
      : b[r.k] - a[r.k];
  });
  FACTIONS.forEach(f=>{ out.fac[f.id] = v.end.fac[f.id] - base.end.fac[f.id]; });
  return out;
}

function rateImpactHtml(){
  if(!G.rateManual) return '';
  let im;
  try{ im = impactOfRatePin(4); }
  catch(err){ return ''; }
  const chips = impactChips(im);
  const empty = !chips || chips === '<div class="impchips"></div>';
  return '<div class="impblock" style="margin-top:10px;padding:10px 0 0;border-top:1px solid rgba(0,0,0,.06)">' +
    '<div class="imphead">Four quarters at '+im.pin.toFixed(2)+'% vs the Bank' +
    '<span class="cost">free</span></div>' +
    '<div class="hint" style="margin:0 0 6px">Same law, pinned rate against the Taylor rule from today\'s starting point.</div>' +
    (empty
      ? '<div class="impfac">No measurable move over four quarters.</div>'
      : chips + impactFactions(im)) +
    '</div>';
}

function projectionWarnings(p){
  const w = [], last = p.rows[p.rows.length-1], first = p.rows[0], e = p.end.econ;
  if(last.yield > 7.5) w.push("Gilt yields reach " + last.yield.toFixed(1) + "%. The debt market is repricing {C}.");
  if(last.debt > G.econ.debt + 4) w.push("Debt rises " + (last.debt - G.econ.debt).toFixed(1) + " points of GDP over four quarters and keeps climbing.");
  if(last.balance < -7) w.push("The deficit settles near " + Math.abs(last.balance).toFixed(1) + "% of GDP, well beyond what the market has tolerated before.");
  if(e.inflation > 5) w.push("Inflation is still " + e.inflation.toFixed(1) + "% a year out, so expect the Bank to keep tightening.");
  if(e.inflation < 0.5) w.push("Inflation drops to " + e.inflation.toFixed(1) + "%. Deflation risk is real.");
  if(first.growth < -0.4) w.push("The first quarter contracts. Fiscal tightening lands before anything else does.");
  if(last.unemployment > G.econ.unemployment + 0.8) w.push("Unemployment rises " + (last.unemployment - G.econ.unemployment).toFixed(1) + " points on this plan.");
  if(last.approval < 32) w.push("Approval falls to " + last.approval.toFixed(0) + "%. Your parliamentary party will notice.");
  if(e.services < 40) w.push("Public services degrade to " + e.services.toFixed(0) + " on the composite index.");
  if(G.draft.policies.fiscalRule && last.balance < -4) w.push("This plan breaches your own statutory debt rule.");
  if(!w.length) w.push("Nothing in this plan trips a Treasury warning. The forecast is still a forecast.");
  return w;
}

/* ==================================================================
   6. THE BILL  (diff between what is law and what you propose)
   ================================================================== */

const dp = t => (t.step && t.step < 1) ? 1 : 0;
const fmtRate = (t,r) => r.toFixed(dp(t)) + "%";
const rateCost = (t,d) => Math.max(1, Math.ceil(Math.abs(d)/t.max*25));

function billClauses(){
  const L = G.law, D = G.draft, out = [];
  if(D.regime !== L.regime)
    out.push({ label:"Restructure the tax system: " + REGIME_BY_ID[D.regime].name, pc:REGIME_BY_ID[D.regime].pc,
               undo:()=>{ D.regime = L.regime; } });
  for(const t of TAXES){
    const a = L.taxes[t.id], b = D.taxes[t.id];
    if(a.on !== b.on){
      out.push({ label:(b.on ? "Introduce " : "Abolish ") + t.name + (b.on ? " at " + fmtRate(t,b.rate) : ""),
                 pc: b.on ? (t.pc || 6) : Math.ceil((t.pc || 6)*0.6),
                 undo:()=>{ b.on = a.on; b.rate = a.rate; } });
    } else if(a.on && Math.abs(a.rate - b.rate) > 1e-9){
      out.push({ label:t.name + ", " + fmtRate(t,a.rate) + " to " + fmtRate(t,b.rate),
                 pc: rateCost(t, b.rate - a.rate), undo:()=>{ b.rate = a.rate; } });
    }
  }
  // income tax structure
  if(Math.abs(D.income.allowance - L.income.allowance) > 1){
    out.push({ label:"Personal allowance " + money(L.income.allowance) + " to " + money(D.income.allowance),
               pc:Math.max(1, Math.ceil(Math.abs(D.income.allowance - L.income.allowance)/1800)),
               undo:()=>{ D.income.allowance = L.income.allowance; D.income.bands[0].from = L.income.bands[0].from; } });
  }
  if(D.income.uprate !== L.income.uprate){
    out.push({ label: D.income.uprate ? "Uprate thresholds with inflation each year"
                                      : "Freeze thresholds in cash terms",
               pc:8, undo:()=>{ D.income.uprate = L.income.uprate; } });
  }
  if(D.income.bands.length !== L.income.bands.length){
    out.push({ label:"Restructure the rate bands: " + L.income.bands.length + " to " + D.income.bands.length,
               pc:12, undo:()=>{ D.income.bands = clone(L.income.bands); } });
  } else {
    D.income.bands.forEach((b,i)=>{
      const a = L.income.bands[i];
      if(Math.abs(a.rate - b.rate) > 1e-9)
        out.push({ label:(BAND_NAMES[i]||("Band "+(i+1))) + " rate " + a.rate + "% to " + b.rate + "%",
                   pc:Math.max(1, Math.ceil(Math.abs(b.rate - a.rate)/3)), undo:()=>{ b.rate = a.rate; } });
      if(i > 0 && Math.abs(a.from - b.from) > 1)
        out.push({ label:(BAND_NAMES[i]||("Band "+(i+1))) + " threshold " + money(a.from) + " to " + money(b.from),
                   pc:Math.max(1, Math.ceil(Math.abs(b.from - a.from)/2500)), undo:()=>{ b.from = a.from; } });
    });
  }
  /* Abolition first: if a side is being scrapped, its rate and threshold moves
     are moot, so they are suppressed to keep the bill readable. */
  [["empOn","Employee national insurance"],["erOn","Employer national insurance"]].forEach(([k,name])=>{
    if(L.ni[k] === D.ni[k]) return;
    const abolishing = !D.ni[k];
    out.push({ label:(abolishing ? "Abolish " : "Reintroduce ") + name.toLowerCase(),
               pc: abolishing ? 26 : 20, undo:()=>{ D.ni[k] = L.ni[k]; } });
  });
  const NI_LABEL = { empRate:"Employee NI rate", erRate:"Employer NI rate" };
  for(const k in NI_LABEL){
    const a = L.ni[k], b = D.ni[k];
    if(Math.abs(a - b) < 1e-9) continue;
    if(!D.ni.empOn && k === "empRate") continue;      // scrapped: the rate is moot
    if(!D.ni.erOn  && k === "erRate")  continue;
    out.push({ label: NI_LABEL[k] + " " + a.toFixed(1)+"% to "+b.toFixed(1)+"%",
               pc: Math.max(1, Math.ceil(Math.abs(b-a)/1.5)), undo:()=>{ D.ni[k] = a; } });
  }

  for(const d of DEPTS){
    const mL = (L.mode||{})[d.id] || "share", mD = (D.mode||{})[d.id] || "share";
    if(mL !== mD){
      const label = { share:"a fixed share of GDP", real:"indexed to inflation", service:"pegged to its service level" };
      out.push({ label:d.name + " budget " + label[mD], pc:5,
                 undo:()=>{ if(mL === "share") delete D.mode[d.id]; else D.mode[d.id] = mL;
                            if(mL === "service") D.hold[d.id] = (L.hold||{})[d.id]; else delete D.hold[d.id]; } });
    }
    const diff = D.spend[d.id] - L.spend[d.id];
    if(Math.abs(diff) > 1e-9)
      out.push({ label:d.name + " " + sgn(diff,1) + " points of GDP", pc:Math.max(1, Math.ceil(Math.abs(diff)*2)),
                 undo:()=>{ D.spend[d.id] = L.spend[d.id]; } });
  }
  if(D.tariff !== L.tariff)
    out.push({ label:"Average tariff " + L.tariff + "% to " + D.tariff + "%", pc:Math.max(1, Math.ceil(Math.abs(D.tariff - L.tariff)*0.8)),
               undo:()=>{ D.tariff = L.tariff; } });
  for(const p of POLICIES){
    const a = !!L.policies[p.id], b = !!D.policies[p.id];
    if(a !== b)
      out.push({ label:(b ? "Enact " : "Repeal ") + p.name, pc: b ? p.pc : Math.ceil(p.pc*0.7),
                 undo:()=>{ if(a) D.policies[p.id] = true; else delete D.policies[p.id]; } });
  }
  for(const v of VICE){
    if(L.vice[v.id] !== D.vice[v.id]){
      const to = v.states.find(s => s.id === D.vice[v.id]);
      out.push({ label:v.name + ": " + to.label.toLowerCase(), pc:v.pc, undo:()=>{ D.vice[v.id] = L.vice[v.id]; } });
    }
  }
  for(const id in DEAL_BY_ID){
    const a = !!L.deals[id], b = !!G.draft.deals[id];
    if(a !== b){
      const d = DEAL_BY_ID[id];
      out.push({ label:(b ? "Ratify " : "Withdraw from ") + d.name, pc: b ? d.pc : Math.ceil(d.pc*1.8),
                 undo:()=>{ if(a) G.draft.deals[id] = true; else delete G.draft.deals[id]; } });
    }
  }
  return out;
}
const billCost = () => billClauses().reduce((a,c)=>a + c.pc, 0);
const isFiscalOnly = cl => cl.every(c => !/Ratify|Withdraw|Enact|Repeal|Cannabis|Psychedelics|Gambling|Alcohol|Tobacco|Adult/.test(c.label));

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* --- seamless 3D value noise --- */
function hash3(i,j,k){
  let n = (i|0)*374761393 + (j|0)*668265263 + (k|0)*1442695040;
  n = (n ^ (n >> 13)) * 1274126177;
  return ((n ^ (n >> 16)) >>> 0) / 4294967295;
}
function vnoise(x,y,z){
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x-xi, yf = y-yi, zf = z-zi;
  const u = xf*xf*(3-2*xf), v = yf*yf*(3-2*yf), w = zf*zf*(3-2*zf);
  const c = (a,b,cc)=>hash3(xi+a, yi+b, zi+cc);
  const x00 = c(0,0,0)+(c(1,0,0)-c(0,0,0))*u, x10 = c(0,1,0)+(c(1,1,0)-c(0,1,0))*u;
  const x01 = c(0,0,1)+(c(1,0,1)-c(0,0,1))*u, x11 = c(0,1,1)+(c(1,1,1)-c(0,1,1))*u;
  return (x00+(x10-x00)*v) + ((x01+(x11-x01)*v) - (x00+(x10-x00)*v))*w;
}
function fbm(x,y,z,oct){
  let s=0, a=0.5, f=1;
  for(let i=0;i<oct;i++){ s += a*vnoise(x*f,y*f,z*f); f*=2.05; a*=0.5; }
  return s;
}

/* ==================================================================
   7a. THE MAP
   A procedurally generated fictional country, drawn to a 2D canvas.
   No libraries and no map data: the coastline is radial noise sampled
   on the angle (seamless by construction) and the interior is carved
   into regions by nearest seed. Geometry is pure arithmetic over typed
   arrays so it can be tested without a canvas; only painting needs one.
   ================================================================== */

const REGIONS = [

  { id:"lakes",     name:"The Lakelands",    x:-0.40, y:-0.36, w:0.07,

  { id:"marches",   name:"Border Marches",   x: 0.36, y:-0.46, w:0.06,
